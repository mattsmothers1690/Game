<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gridiron Dynasty</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #0d1117;
    color: #e6edf3;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 14px;
    padding-bottom: 24px;
  }
  #app { max-width: 720px; margin: 0 auto; padding: 8px; }
  h1, h2, h3 { margin: 8px 0; }
  h1 { font-size: 1.2rem; }
  h2 { font-size: 1.05rem; color: #7ee787; }
  h3 { font-size: 0.95rem; color: #79c0ff; }
  .card {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 10px;
  }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .muted { color: #8b949e; font-size: 0.85em; }
  button {
    background: #238636;
    color: white;
    border: none;
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 0.9em;
    cursor: pointer;
    margin: 2px 0;
  }
  button:disabled { background: #30363d; color: #6e7681; cursor: not-allowed; }
  button.secondary { background: #21262d; border: 1px solid #30363d; }
  button.danger { background: #8b2635; }
  select, input[type=number] {
    background: #0d1117; color: #e6edf3; border: 1px solid #30363d;
    border-radius: 6px; padding: 6px; font-size: 0.9em;
  }
  table { width: 100%; border-collapse: collapse; font-size: 0.85em; }
  th, td { text-align: left; padding: 4px 6px; border-bottom: 1px solid #21262d; }
  th { color: #8b949e; font-weight: 600; }
  .tabs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; position: sticky; top: 0; background: #0d1117; padding: 6px 0; z-index: 5; }
  .tab {
    background: #161b22; border: 1px solid #30363d; color: #c9d1d9;
    border-radius: 6px; padding: 6px 10px; font-size: 0.85em; cursor: pointer;
  }
  .tab.active { background: #1f6feb; border-color: #1f6feb; color: white; }
  .badge {
    display: inline-block; background: #21262d; border-radius: 4px;
    padding: 1px 6px; font-size: 0.78em; margin-left: 4px;
  }
  .pill-user { background: #1f6feb; }
  .pill-good { background: #238636; }
  .pill-bad { background: #8b2635; }
  .plist { max-height: 420px; overflow-y: auto; }
  .prow { display: flex; justify-content: space-between; align-items: center; padding: 6px 4px; border-bottom: 1px solid #21262d; gap: 6px; }
  .prow:last-child { border-bottom: none; }
  .pname { font-weight: 600; }
  .log { font-size: 0.82em; color: #c9d1d9; line-height: 1.5; max-height: 260px; overflow-y: auto; }
  .startscreen { text-align: center; padding: 40px 12px; }
  .teamgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 12px; }
  .teamopt {
    background: #161b22; border: 1px solid #30363d; border-radius: 8px;
    padding: 10px; cursor: pointer;
  }
  .teamopt.sel { border-color: #1f6feb; background: #12233f; }
  .flexgap { display: flex; gap: 6px; flex-wrap: wrap; }
  input[type=number] { width: 64px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
(function () {
  'use strict';

  var SAVE_KEY = 'gridiron_save_v1';

  var POSITIONS = ['QB','RB','WR','TE','OL','DL','LB','CB','S','K'];
  var STARTER_NEEDS = { QB:1, RB:1, WR:2, TE:1, OL:3, DL:3, LB:2, CB:2, S:1, K:1 };
  var OFF_WEIGHTS = { QB:0.30, RB:0.10, WR:0.20, TE:0.10, OL:0.30 };
  var DEF_WEIGHTS = { DL:0.30, LB:0.30, CB:0.30, S:0.10 };

  var POSITION_ATTRS = {
    QB: ['ARM','ACC','MOB'], RB: ['SPD','POW','VIS'], WR: ['SPD','SIZE','HANDS'],
    TE: ['SIZE','HANDS','RBLK'], OL: ['RBLK','PBLK'], DL: ['RSTOP','PRUSH'],
    LB: ['RSTOP','COV'], CB: ['SPD','SIZE','COV'], S: ['RANGE','RSUP','COV'], K: ['POW','ACC']
  };
  var ATTR_LABELS = {
    ARM:'ARM', ACC:'ACC', MOB:'MOB', SPD:'SPD', POW:'POW', VIS:'VIS', SIZE:'SIZE',
    HANDS:'HND', RBLK:'RBK', PBLK:'PBK', RSTOP:'RST', PRUSH:'PRS', COV:'COV', RANGE:'RNG', RSUP:'RSP'
  };
  var BALANCED_TYPE = { id: 'balanced', label: 'Balanced', bias: {} };
  var PLAYER_TYPES = {
    QB: [{ id:'gunslinger', label:'Gunslinger', bias:{ARM:10,ACC:-6} }, { id:'fieldgeneral', label:'Field General', bias:{ACC:10,ARM:-6} }, { id:'dualthreat', label:'Dual-Threat', bias:{MOB:14,ARM:-4,ACC:-4} }, BALANCED_TYPE],
    RB: [{ id:'burner', label:'Burner', bias:{SPD:12,POW:-10} }, { id:'bruiser', label:'Bruiser', bias:{POW:12,SPD:-10} }, { id:'workhorse', label:'Workhorse', bias:{VIS:10,SPD:-5,POW:-5} }, BALANCED_TYPE],
    WR: [{ id:'burner', label:'Burner', bias:{SPD:12,SIZE:-10} }, { id:'possession', label:'Possession', bias:{SIZE:12,SPD:-10} }, { id:'technician', label:'Technician', bias:{HANDS:10,SPD:-4,SIZE:-4} }, BALANCED_TYPE],
    TE: [{ id:'receiving', label:'Receiving', bias:{HANDS:10,RBLK:-10} }, { id:'blocking', label:'Blocking', bias:{RBLK:10,HANDS:-10} }, BALANCED_TYPE],
    OL: [{ id:'roadgrader', label:'Road Grader', bias:{RBLK:10,PBLK:-8} }, { id:'protector', label:'Protector', bias:{PBLK:10,RBLK:-8} }, BALANCED_TYPE],
    DL: [{ id:'rusher', label:'Pass Rusher', bias:{PRUSH:10,RSTOP:-8} }, { id:'stopper', label:'Run Stopper', bias:{RSTOP:10,PRUSH:-8} }, BALANCED_TYPE],
    LB: [{ id:'coverlb', label:'Coverage LB', bias:{COV:10,RSTOP:-8} }, { id:'thumper', label:'Thumper', bias:{RSTOP:10,COV:-8} }, BALANCED_TYPE],
    CB: [{ id:'press', label:'Press/Physical', bias:{SIZE:10,SPD:-8} }, { id:'coverage', label:'Coverage', bias:{SPD:10,SIZE:-8} }, BALANCED_TYPE],
    S: [{ id:'ballhawk', label:'Ball Hawk', bias:{RANGE:10,RSUP:-8} }, { id:'enforcer', label:'Enforcer', bias:{RSUP:10,RANGE:-8} }, BALANCED_TYPE],
    K: [{ id:'kicker', label:'Kicker', bias:{} }]
  };

  var OFFENSE_SCHEMES = {
    balanced: { label: 'Balanced', desc: 'No lean either way.', passWeight: 0.55, deepBias: 0, shortEdgeBonus: 0, runFrontBonus: 0, sackMult: 1 },
    airraid: { label: 'Air Raid', desc: 'Pass-heavy, pushes the ball deep. Thin run support.', passWeight: 0.72, deepBias: 0.08, shortEdgeBonus: 0, runFrontBonus: -3, sackMult: 1 },
    groundpound: { label: 'Ground & Pound', desc: 'Run-first, grinds the clock. Fewer explosive plays.', passWeight: 0.35, deepBias: -0.04, shortEdgeBonus: 0, runFrontBonus: 5, sackMult: 1 },
    westcoast: { label: 'West Coast', desc: 'Quick short/intermediate throws. Gets the ball out fast.', passWeight: 0.62, deepBias: -0.08, shortEdgeBonus: 5, runFrontBonus: 0, sackMult: 0.8 }
  };
  var DEFENSE_SCHEMES = {
    balanced: { label: 'Balanced', desc: 'No lean either way.', pressureMult: 1, coverageShift: 0, explosiveMult: 1, safetyHelpMult: 1 },
    blitz: { label: 'Blitz-Heavy', desc: 'Sends extra rushers - more sacks, but exposed downfield.', pressureMult: 1.5, coverageShift: -6, explosiveMult: 1.1, safetyHelpMult: 0.7 },
    benddontbreak: { label: "Bend-Don't-Break", desc: 'Concedes underneath, protects against the big play.', pressureMult: 0.85, coverageShift: 4, explosiveMult: 0.75, safetyHelpMult: 1.3 },
    manpress: { label: 'Man Press', desc: 'Tight man coverage at the line. High risk, high reward.', pressureMult: 1, coverageShift: 6, explosiveMult: 1.15, safetyHelpMult: 0.6 }
  };

  var OFFENSE_PACKAGES = {
    spread: { label: '11 Personnel (Spread)', desc: '3 WR, 1 TE, 1 RB - maximizes passing weapons.', rb: 1, te: 1, wr: 3 },
    twote: { label: '12 Personnel', desc: '2 WR, 2 TE, 1 RB - extra blocker/receiver, harder to defend both ways.', rb: 1, te: 2, wr: 2 },
    power: { label: '21 Personnel (Power)', desc: '2 WR, 1 TE, 2 RB - a lead blocker for a bruising run game.', rb: 2, te: 1, wr: 2 }
  };
  var DEFENSE_PACKAGES = {
    base: { label: 'Base (4-3/3-4)', desc: 'Standard front - balanced vs. run and pass.', dl: 2, lb: 2, cb: 2, s: 1 },
    nickel: { label: 'Nickel', desc: 'Extra DB - stronger vs. 3-WR sets, softer vs. the run.', dl: 2, lb: 1, cb: 3, s: 1 },
    dime: { label: 'Dime', desc: 'Floods coverage - great vs. the pass, minimal run support.', dl: 1, lb: 1, cb: 3, s: 2 },
    heavy: { label: 'Goal Line / Heavy', desc: 'Extra bodies in the box - stuffs the run, thin on coverage.', dl: 3, lb: 3, cb: 1, s: 1 }
  };

  var INJURY_BASE = 0.006;
  var POSITION_INJURY_RISK = { QB:0.6, RB:1.3, WR:0.9, TE:1.1, OL:1.2, DL:1.3, LB:1.3, CB:0.9, S:1.0, K:0.3 };
  var INJURY_SEVERITY = [
    { label: 'Minor', weeksMin: 1, weeksMax: 1, weight: 55 },
    { label: 'Moderate', weeksMin: 2, weeksMax: 3, weight: 30 },
    { label: 'Major', weeksMin: 4, weeksMax: 6, weight: 12 },
    { label: 'Season-Ending', weeksMin: 99, weeksMax: 99, weight: 3 }
  ];

  var ROSTER_TARGET = 34;
  var ROSTER_FLOOR = 30;
  var ROSTER_MAX = 45;
  var STARTING_CAP = 150;
  var CAP_GROWTH_PER_YEAR = 5;

  var TRADE_POSITION_WEIGHT = { QB:1.6, WR:1.2, CB:1.15, DL:1.1, LB:1.05, S:1.0, TE:1.0, RB:0.95, OL:1.0, K:0.4 };
  var TRADE_ACCEPT_THRESHOLD = 0.90;

  function playerValue(p) {
    var base = Math.pow(Math.max(0, p.overall - 45), 1.9) / 8;
    var posW = TRADE_POSITION_WEIGHT[p.position] || 1;
    var ageMod = p.age <= 26 ? 1.15 : (p.age <= 29 ? 1.0 : (p.age <= 32 ? 0.75 : 0.5));
    var potentialBonus = 1 + Math.max(0, p.potential - p.overall) * 0.02;
    return Math.round(base * posW * ageMod * potentialBonus);
  }

  function pickValue(pickIndex) {
    var pickNum = pickIndex + 1;
    return Math.max(15, Math.round(1400 * Math.pow(0.96, pickNum - 1)));
  }

  var TEAMS_SEED = [
    { city: 'Boulder City', mascot: 'Marauders', abbr: 'BCM' },
    { city: 'Port Haven', mascot: 'Wolves', abbr: 'PHW' },
    { city: 'Steel Valley', mascot: 'Ironhawks', abbr: 'SVI' },
    { city: 'Redrock', mascot: 'Vipers', abbr: 'RRV' },
    { city: 'Frostline', mascot: 'Bears', abbr: 'FLB' },
    { city: 'Bay Area', mascot: 'Tide', abbr: 'BAT' },
    { city: 'Sable Ridge', mascot: 'Outlaws', abbr: 'SRO' },
    { city: 'Crescent City', mascot: 'Comets', abbr: 'CCC' }
  ];

  var FIRST_NAMES = ['Marcus','Jalen','Trevor','Deshaun','Cole','Ezra','Malik','Grant','Xavier','Reid',
    'Tyrell','Jaxon','Bryce','Dominic','Isiah','Landon','Nasir','Corbin','Elias','Rashad',
    'Miles','Tanner','Amari','Jace','Wesley','Kobe','Aiden','Devon','Cyrus','Holden'];
  var LAST_NAMES = ['Carter','Whitfield','Boone','Mercer','Ashford','Dalton','Vance','Reyes','Holloway','Sinclair',
    'Pruitt','Kessler','Hargrove','Winslow','Beaumont','Castellan','Marsh','Ellison','Trask','Nunez',
    'Ferro','Odom','Bledsoe','Quintero','Hatch','Larkin','Stroud','Vega','Kilgore','Rourke'];

  var $ = { rand: rand, choice: choice, clamp: clamp };

  function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
  function choice(arr) { return arr[rand(0, arr.length - 1)]; }
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function round1(v) { return Math.round(v * 10) / 10; }
  function randomName() { return choice(FIRST_NAMES) + ' ' + choice(LAST_NAMES); }

  var state = null;

  // ---------- persistence ----------
  function save() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (e) {}
  }
  function load() {
    try {
      var raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return null;
      return JSON.parse(raw);
    } catch (e) { return null; }
  }
  function resetGame() {
    if (!confirm('Delete this franchise and start over?')) return;
    localStorage.removeItem(SAVE_KEY);
    state = null;
    render();
  }

  // ---------- player model ----------
  function makePlayer(position, age, overallTarget) {
    state.nextPlayerId += 1;
    var type = choice(PLAYER_TYPES[position]);
    var keys = POSITION_ATTRS[position];
    var attrs = {};
    keys.forEach(function (key) {
      var bias = type.bias[key] || 0;
      attrs[key] = clamp(overallTarget + bias + rand(-4, 4), 35, 99);
    });
    var overall = Math.round(keys.reduce(function (s, k) { return s + attrs[k]; }, 0) / keys.length);
    return {
      id: state.nextPlayerId,
      name: randomName(),
      position: position,
      age: age,
      attrs: attrs,
      overall: overall,
      potential: overall,
      typeId: type.id,
      typeLabel: type.label,
      salary: 0,
      yearsLeft: 0,
      teamId: null,
      scoutLevel: 3,
      isRookie: false,
      injuryUntilWeek: 0,
      injuryLabel: null
    };
  }

  function recomputeOverall(p) {
    var keys = POSITION_ATTRS[p.position];
    p.overall = Math.round(keys.reduce(function (s, k) { return s + p.attrs[k]; }, 0) / keys.length);
  }

  function bumpAttr(p, key, delta) {
    p.attrs[key] = clamp(p.attrs[key] + delta, 35, 99);
    recomputeOverall(p);
    if (p.overall > p.potential) {
      var keys = POSITION_ATTRS[p.position];
      var over = (p.overall - p.potential) * keys.length;
      p.attrs[key] = clamp(p.attrs[key] - over, 35, 99);
      recomputeOverall(p);
    }
  }

  function salaryFor(overall, age) {
    var base = 0.4 + Math.max(0, overall - 50) * 0.12;
    if (age >= 31) base *= 1.15;
    if (age <= 23) base *= 0.85;
    return Math.max(0.4, round1(base));
  }

  function rookieSalary(pickNumber) {
    return Math.max(0.4, round1(3.0 - pickNumber * 0.08));
  }

  function generateVeteran() {
    var pos = choice(POSITIONS);
    var age = rand(22, 34);
    var roll = Math.random();
    var overallTarget;
    if (roll < 0.06) overallTarget = rand(85, 92);
    else if (roll < 0.30) overallTarget = rand(72, 84);
    else if (roll < 0.70) overallTarget = rand(58, 71);
    else overallTarget = rand(42, 57);
    var p = makePlayer(pos, age, overallTarget);
    p.potential = clamp(p.overall + rand(0, 5), p.overall, 99);
    p.salary = salaryFor(p.overall, p.age);
    p.yearsLeft = rand(1, 4);
    return p;
  }

  function generateProspect() {
    var pos = choice(POSITIONS);
    var age = rand(21, 23);
    var overallTarget = rand(48, 88);
    var p = makePlayer(pos, age, overallTarget);
    p.potential = clamp(p.overall + rand(5, 25), p.overall, 99);
    p.isRookie = true;
    p.scoutLevel = 0;
    return p;
  }

  function scoutedRange(p) {
    if (!p.isRookie || p.scoutLevel >= 3) return { lo: p.overall, hi: p.overall, exact: true };
    var spread = p.scoutLevel === 0 ? 15 : (p.scoutLevel === 1 ? 8 : 3);
    return { lo: clamp(p.overall - spread, 35, 99), hi: clamp(p.overall + spread, 35, 99), exact: false };
  }
  function scoutedAttrRange(p, key) {
    if (!p.isRookie || p.scoutLevel >= 3) return { lo: p.attrs[key], hi: p.attrs[key] };
    var spread = p.scoutLevel === 0 ? 15 : (p.scoutLevel === 1 ? 8 : 3);
    return { lo: clamp(p.attrs[key] - spread, 35, 99), hi: clamp(p.attrs[key] + spread, 35, 99) };
  }
  var SCOUT_COST = [3, 5, 8];

  function formatStats(p) {
    var keys = POSITION_ATTRS[p.position];
    var attrStr = keys.map(function (k) { return ATTR_LABELS[k] + ' ' + p.attrs[k]; }).join(' &middot; ');
    return 'OVR ' + p.overall + ' (' + p.typeLabel + ') &middot; ' + attrStr;
  }
  function formatScoutedStats(p) {
    if (p.scoutLevel >= 3) return formatStats(p);
    var keys = POSITION_ATTRS[p.position];
    var typeTxt = p.scoutLevel >= 1 ? p.typeLabel : '???';
    var r = scoutedRange(p);
    var attrStr = keys.map(function (k) {
      var rr = scoutedAttrRange(p, k);
      return ATTR_LABELS[k] + ' ' + rr.lo + '-' + rr.hi;
    }).join(' &middot; ');
    return 'OVR ' + r.lo + '-' + r.hi + ' (' + typeTxt + ') &middot; ' + attrStr;
  }

  // ---------- team model ----------
  function makeTeam(id, seed, isUser) {
    return {
      id: id, city: seed.city, mascot: seed.mascot, abbr: seed.abbr, name: seed.city + ' ' + seed.mascot,
      isUser: !!isUser, roster: [], cap: STARTING_CAP,
      offScheme: choice(Object.keys(OFFENSE_SCHEMES)), defScheme: choice(Object.keys(DEFENSE_SCHEMES)),
      offPackage: choice(Object.keys(OFFENSE_PACKAGES)), defPackage: choice(Object.keys(DEFENSE_PACKAGES)),
      depthOrder: {},
      record: { w: 0, l: 0, t: 0 }, pf: 0, pa: 0
    };
  }

  function playersAt(team, pos) {
    return team.roster.map(function (id) { return state.players[id]; }).filter(function (p) { return p.position === pos; });
  }

  function isInjured(p) {
    return !!p.injuryUntilWeek && state.week <= p.injuryUntilWeek;
  }

  function healthyPlayersAt(team, pos) {
    return playersAt(team, pos).filter(function (p) { return !isInjured(p); });
  }

  function topNAvg(list, n) {
    var sorted = list.slice().sort(function (a, b) { return b.overall - a.overall; });
    var sum = 0;
    for (var i = 0; i < n; i++) sum += sorted[i] ? sorted[i].overall : 40;
    return sum / n;
  }

  function fullDepthOrder(team, pos) {
    var all = playersAt(team, pos);
    if (team.isUser && team.depthOrder && team.depthOrder[pos] && team.depthOrder[pos].length) {
      var ordered = team.depthOrder[pos]
        .map(function (id) { return state.players[id]; })
        .filter(function (p) { return p && p.teamId === team.id && p.position === pos; });
      var seen = {};
      ordered.forEach(function (p) { seen[p.id] = true; });
      all.forEach(function (p) { if (!seen[p.id]) ordered.push(p); });
      return ordered;
    }
    return all.slice().sort(function (a, b) { return b.overall - a.overall; });
  }

  function ensureDepthOrder(team, pos) {
    if (!team.depthOrder) team.depthOrder = {};
    if (!team.depthOrder[pos]) team.depthOrder[pos] = fullDepthOrder(team, pos).map(function (p) { return p.id; });
  }

  function moveDepthChart(pos, playerId, direction) {
    var team = state.teams[state.userTeamId];
    ensureDepthOrder(team, pos);
    var arr = team.depthOrder[pos];
    var idx = arr.indexOf(playerId);
    var swapIdx = idx + direction;
    if (idx < 0 || swapIdx < 0 || swapIdx >= arr.length) return;
    var tmp = arr[idx]; arr[idx] = arr[swapIdx]; arr[swapIdx] = tmp;
    save();
  }

  function orderedHealthyAt(team, pos) {
    return fullDepthOrder(team, pos).filter(function (p) { return !isInjured(p); });
  }

  function bestAt(team, pos, n) {
    return orderedHealthyAt(team, pos).slice(0, n);
  }

  function personnel(team) {
    var offPkg = OFFENSE_PACKAGES[team.offPackage] || OFFENSE_PACKAGES.spread;
    var defPkg = DEFENSE_PACKAGES[team.defPackage] || DEFENSE_PACKAGES.base;
    var RBs = bestAt(team, 'RB', offPkg.rb);
    return {
      QB: bestAt(team, 'QB', 1)[0], RB: RBs[0], RB2: RBs[1],
      WRs: bestAt(team, 'WR', offPkg.wr), TEs: bestAt(team, 'TE', offPkg.te), OLs: bestAt(team, 'OL', 3),
      DLs: bestAt(team, 'DL', defPkg.dl), LBs: bestAt(team, 'LB', defPkg.lb),
      CBs: bestAt(team, 'CB', defPkg.cb), Ss: bestAt(team, 'S', defPkg.s), K: bestAt(team, 'K', 1)[0]
    };
  }

  function offenseRating(team) {
    var total = 0;
    Object.keys(OFF_WEIGHTS).forEach(function (pos) {
      total += topNAvg(bestAt(team, pos, STARTER_NEEDS[pos]), STARTER_NEEDS[pos]) * OFF_WEIGHTS[pos];
    });
    return total;
  }
  function defenseRating(team) {
    var total = 0;
    Object.keys(DEF_WEIGHTS).forEach(function (pos) {
      total += topNAvg(bestAt(team, pos, STARTER_NEEDS[pos]), STARTER_NEEDS[pos]) * DEF_WEIGHTS[pos];
    });
    return total;
  }
  function kickerRating(team) { return topNAvg(bestAt(team, 'K', 1), 1); }

  function capSpace(team) {
    var used = team.roster.reduce(function (sum, id) { return sum + state.players[id].salary; }, 0);
    return round1(team.cap - used);
  }

  function weakestNeed(team) {
    var worstPos = null, worstVal = 999;
    Object.keys(STARTER_NEEDS).forEach(function (pos) {
      var v = topNAvg(healthyPlayersAt(team, pos), STARTER_NEEDS[pos]);
      if (v < worstVal) { worstVal = v; worstPos = pos; }
    });
    return worstPos;
  }

  function positionDeficits(team) {
    return Object.keys(STARTER_NEEDS).filter(function (pos) {
      var count = team.roster.filter(function (id) { return state.players[id].position === pos; }).length;
      return count < STARTER_NEEDS[pos];
    });
  }

  function pickSigningTarget(team, candidates) {
    if (candidates.length === 0) return null;
    var deficits = positionDeficits(team);
    if (deficits.length > 0) {
      var deficitCandidates = candidates.filter(function (p) { return deficits.indexOf(p.position) >= 0; });
      if (deficitCandidates.length > 0) {
        return deficitCandidates.slice().sort(function (a, b) { return b.overall - a.overall; })[0];
      }
    }
    var need = weakestNeed(team);
    return candidates.slice().sort(function (a, b) {
      var sa = a.overall + (a.position === need ? 8 : 0);
      var sb = b.overall + (b.position === need ? 8 : 0);
      return sb - sa;
    })[0];
  }

  function addToRoster(team, player) {
    player.teamId = team.id;
    team.roster.push(player.id);
    if (team.depthOrder && team.depthOrder[player.position]) team.depthOrder[player.position].push(player.id);
  }
  function removeFromRoster(team, playerId) {
    var idx = team.roster.indexOf(playerId);
    if (idx >= 0) team.roster.splice(idx, 1);
    if (team.depthOrder) {
      Object.keys(team.depthOrder).forEach(function (pos) {
        var i = team.depthOrder[pos].indexOf(playerId);
        if (i >= 0) team.depthOrder[pos].splice(i, 1);
      });
    }
  }

  function log(msg) {
    state.log.unshift(msg);
    if (state.log.length > 60) state.log.length = 60;
  }

  // ---------- league setup ----------
  function newGame(userTeamIndex) {
    state = {
      year: 1, week: 0, phase: 'draft', screen: 'hub',
      nextPlayerId: 0, userTeamId: userTeamIndex,
      teams: [], players: {}, schedule: [], playoffs: null,
      draft: null, freeAgents: [], trainingPoints: 0,
      history: [], log: []
    };
    TEAMS_SEED.forEach(function (seed, i) { state.teams.push(makeTeam(i, seed, i === userTeamIndex)); });
    startDraft(6);
    for (var i = 0; i < 220; i++) {
      var fa = generateVeteran();
      state.freeAgents.push(fa.id);
      state.players[fa.id] = fa;
    }
    log('Welcome, GM of the ' + state.teams[userTeamIndex].name + '! The inaugural draft is underway.');
    save();
  }

  function startDraft(rounds) {
    var order;
    if (state.year === 1) {
      order = state.teams.map(function (t) { return t.id; });
      shuffle(order);
    } else {
      order = state.teams.slice().sort(function (a, b) {
        if (a.record.w !== b.record.w) return a.record.w - b.record.w;
        return (a.pf - a.pa) - (b.pf - b.pa);
      }).map(function (t) { return t.id; });
    }
    var fullOrder = [];
    for (var r = 0; r < rounds; r++) fullOrder = fullOrder.concat(order);
    var cls = [];
    for (var i = 0; i < order.length * rounds; i++) {
      var p = generateProspect();
      state.players[p.id] = p;
      cls.push(p.id);
    }
    state.draft = { order: fullOrder, pickIndex: 0, class: cls, scoutBudget: 40 };
    state.phase = 'draft';
    state.screen = 'draft';
  }

  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = rand(0, i);
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
  }

  function currentPickTeamId() {
    var d = state.draft;
    if (!d || d.pickIndex >= d.order.length) return null;
    return d.order[d.pickIndex];
  }

  function draftPickTo(teamId, prospectId) {
    var d = state.draft;
    var pickNumber = d.pickIndex + 1;
    var team = state.teams[teamId];
    var p = state.players[prospectId];
    p.salary = rookieSalary(pickNumber);
    p.yearsLeft = 3;
    p.scoutLevel = 3;
    addToRoster(team, p);
    var idx = d.class.indexOf(prospectId);
    if (idx >= 0) d.class.splice(idx, 1);
    d.pickIndex += 1;
    log('Pick ' + pickNumber + ': ' + team.abbr + ' select ' + p.name + ' (' + p.position + ', ' + p.overall + ' OVR)' + (team.isUser ? '' : ''));
  }

  function aiPickFor(teamId) {
    var d = state.draft;
    var team = state.teams[teamId];
    if (d.class.length === 0) return;
    var candidates = d.class.map(function (pid) { return state.players[pid]; });
    var pick = pickSigningTarget(team, candidates);
    if (!pick) return;
    draftPickTo(teamId, pick.id);
  }

  function advanceDraft() {
    var d = state.draft;
    while (d.pickIndex < d.order.length) {
      var tid = d.order[d.pickIndex];
      if (tid === state.userTeamId) return;
      aiPickFor(tid);
    }
    finishDraft();
  }

  function simRestOfDraft() {
    var d = state.draft;
    while (d.pickIndex < d.order.length) {
      var tid = d.order[d.pickIndex];
      aiPickFor(tid);
    }
    finishDraft();
  }

  function finishDraft() {
    state.phase = 'freeagency';
    state.screen = 'freeagency';
    var count = state.year === 1 ? 0 : 26;
    for (var i = 0; i < count; i++) {
      var fa = generateVeteran();
      state.players[fa.id] = fa;
      state.freeAgents.push(fa.id);
    }
    log('The draft has concluded. Free agency is open.');
    save();
  }

  // ---------- free agency ----------
  function signFreeAgent(playerId, years) {
    var team = state.teams[state.userTeamId];
    var p = state.players[playerId];
    var salary = salaryFor(p.overall, p.age);
    if (salary > capSpace(team)) return false;
    if (team.roster.length >= ROSTER_MAX) return false;
    p.salary = salary;
    p.yearsLeft = years;
    addToRoster(team, p);
    var idx = state.freeAgents.indexOf(playerId);
    if (idx >= 0) state.freeAgents.splice(idx, 1);
    log(team.abbr + ' sign FA ' + p.name + ' (' + p.position + ', ' + p.overall + ' OVR) - ' + salary + 'M x' + years + 'yr');
    save();
    return true;
  }

  function advanceFAPeriod() {
    var signings = 0, attempts = 0;
    while (signings < 3 && attempts < 40 && state.freeAgents.length > 0) {
      attempts++;
      var teamsWithRoom = state.teams.filter(function (t) {
        return !t.isUser && t.roster.length < ROSTER_TARGET;
      });
      if (teamsWithRoom.length === 0) break;
      var team = choice(teamsWithRoom);
      var candidates = state.freeAgents.map(function (id) { return state.players[id]; })
        .filter(function (p) { return salaryFor(p.overall, p.age) <= capSpace(team); });
      var pick = pickSigningTarget(team, candidates);
      if (!pick) continue;
      var salary = salaryFor(pick.overall, pick.age);
      pick.salary = salary;
      pick.yearsLeft = rand(1, 3);
      addToRoster(team, pick);
      var idx = state.freeAgents.indexOf(pick.id);
      if (idx >= 0) state.freeAgents.splice(idx, 1);
      log(team.abbr + ' sign FA ' + pick.name + ' (' + pick.position + ', ' + pick.overall + ' OVR)');
      signings++;
    }
    save();
  }

  // ---------- trades ----------
  function tradeablePicksFor(teamId) {
    if (state.phase !== 'draft' || !state.draft) return [];
    var picks = [];
    for (var i = state.draft.pickIndex; i < state.draft.order.length; i++) {
      if (state.draft.order[i] === teamId) picks.push(i);
    }
    return picks;
  }

  function sideValue(playerIds, pickIndices) {
    var total = 0;
    playerIds.forEach(function (id) { var p = state.players[id]; if (p) total += playerValue(p); });
    pickIndices.forEach(function (idx) { total += pickValue(idx); });
    return total;
  }

  function evaluateTrade(aiTeam, sendPlayers, sendPicks, receivePlayers, receivePicks) {
    var resultingSize = aiTeam.roster.length - receivePlayers.length + sendPlayers.length;
    if (resultingSize > ROSTER_MAX) return { accept: false, reason: 'would push their roster over the limit' };
    if (resultingSize < 1) return { accept: false, reason: 'would leave their roster empty' };

    var posCounts = {};
    aiTeam.roster.forEach(function (id) {
      var pl = state.players[id];
      posCounts[pl.position] = (posCounts[pl.position] || 0) + 1;
    });
    receivePlayers.forEach(function (p) { posCounts[p.position] = (posCounts[p.position] || 0) - 1; });
    for (var pos in STARTER_NEEDS) {
      if ((posCounts[pos] || 0) <= 0) return { accept: false, reason: 'would leave them with no ' + pos };
    }

    var salaryOut = receivePlayers.reduce(function (s, p) { return s + p.salary; }, 0);
    var salaryIn = sendPlayers.reduce(function (s, p) { return s + p.salary; }, 0);
    if (capSpace(aiTeam) + salaryOut - salaryIn < 0) return { accept: false, reason: 'cap space' };

    var aiGets = sideValue(sendPlayers.map(function (p) { return p.id; }), sendPicks);
    var aiGives = sideValue(receivePlayers.map(function (p) { return p.id; }), receivePicks);
    if (aiGives > aiGets * (1 / TRADE_ACCEPT_THRESHOLD)) return { accept: false, reason: 'not enough value' };

    return { accept: true };
  }

  function executeTrade(userTeam, aiTeam, sendPlayers, sendPicks, receivePlayers, receivePicks) {
    sendPlayers.forEach(function (p) { removeFromRoster(userTeam, p.id); addToRoster(aiTeam, p); });
    receivePlayers.forEach(function (p) { removeFromRoster(aiTeam, p.id); addToRoster(userTeam, p); });
    sendPicks.forEach(function (idx) { state.draft.order[idx] = aiTeam.id; });
    receivePicks.forEach(function (idx) { state.draft.order[idx] = userTeam.id; });
    var parts = [];
    if (sendPlayers.length) parts.push(sendPlayers.map(function (p) { return p.name; }).join(', '));
    if (sendPicks.length) parts.push(sendPicks.map(function (i) { return 'Pick #' + (i + 1); }).join(', '));
    var received = [];
    if (receivePlayers.length) received.push(receivePlayers.map(function (p) { return p.name; }).join(', '));
    if (receivePicks.length) received.push(receivePicks.map(function (i) { return 'Pick #' + (i + 1); }).join(', '));
    log('Trade with ' + aiTeam.name + ': sent ' + (parts.join(' + ') || 'nothing') + ' for ' + (received.join(' + ') || 'nothing') + '.');
    save();
  }

  function proposeTrade(partnerId, sendPlayerIds, sendPicks, receivePlayerIds, receivePicks) {
    var userTeam = state.teams[state.userTeamId];
    var aiTeam = state.teams[partnerId];
    if (!aiTeam) { log('Select a trade partner first.'); return; }
    var sendPlayers = sendPlayerIds.map(function (id) { return state.players[id]; }).filter(Boolean);
    var receivePlayers = receivePlayerIds.map(function (id) { return state.players[id]; }).filter(Boolean);
    if (sendPlayers.length + sendPicks.length + receivePlayers.length + receivePicks.length === 0) {
      log('A trade needs at least one asset on the table.');
      return;
    }
    var userResultingSize = userTeam.roster.length - sendPlayers.length + receivePlayers.length;
    if (userResultingSize > ROSTER_MAX) { log('Trade blocked: your roster would exceed the max size.'); return; }
    var userSalaryOut = sendPlayers.reduce(function (s, p) { return s + p.salary; }, 0);
    var userSalaryIn = receivePlayers.reduce(function (s, p) { return s + p.salary; }, 0);
    if (capSpace(userTeam) + userSalaryOut - userSalaryIn < 0) { log('Trade blocked: you don\'t have the cap space to take on that salary.'); return; }

    var result = evaluateTrade(aiTeam, sendPlayers, sendPicks, receivePlayers, receivePicks);
    if (result.accept) {
      executeTrade(userTeam, aiTeam, sendPlayers, sendPicks, receivePlayers, receivePicks);
      log(aiTeam.name + ' accept the trade!');
    } else {
      log(aiTeam.name + ' reject the trade - ' + result.reason + '.');
    }
    save();
  }

  function autoFillRosterFloor(team, floor) {
    var signed = 0, guard = 0;
    while (team.roster.length < floor && state.freeAgents.length > 0 && guard < 200) {
      guard++;
      var candidates = state.freeAgents.map(function (id) { return state.players[id]; })
        .filter(function (p) { return salaryFor(p.overall, p.age) <= capSpace(team); });
      var pick = pickSigningTarget(team, candidates);
      if (!pick) break;
      pick.salary = salaryFor(pick.overall, pick.age);
      pick.yearsLeft = rand(1, 3);
      addToRoster(team, pick);
      var idx = state.freeAgents.indexOf(pick.id);
      if (idx >= 0) state.freeAgents.splice(idx, 1);
      signed++;
    }
    return signed;
  }

  function startSeason() {
    var fillOrder = state.teams.map(function (t) { return t.id; });
    shuffle(fillOrder);
    fillOrder.forEach(function (teamId) {
      var team = state.teams[teamId];
      if (team.roster.length < ROSTER_FLOOR) {
        var n = autoFillRosterFloor(team, ROSTER_FLOOR);
        if (n > 0) log(team.name + ' fills out its roster with ' + n + ' emergency free agent signing' + (n === 1 ? '' : 's') + ' before kickoff.');
      }
    });
    state.schedule = buildSchedule();
    state.week = 1;
    state.phase = 'season';
    state.screen = 'hub';
    log('Year ' + state.year + ' regular season begins!');
    save();
  }

  function buildSchedule() {
    var ids = state.teams.map(function (t) { return t.id; });
    var n = ids.length;
    var rounds = [];
    var arr = ids.slice();
    for (var r = 0; r < n - 1; r++) {
      var weekGames = [];
      for (var i = 0; i < n / 2; i++) {
        var home = arr[i], away = arr[n - 1 - i];
        weekGames.push({ week: r + 1, homeId: home, awayId: away, played: false, homeScore: 0, awayScore: 0, log: [] });
      }
      rounds.push(weekGames);
      var fixed = arr[0];
      var rest = arr.slice(1);
      rest.unshift(rest.pop());
      arr = [fixed].concat(rest);
    }
    var flat = [];
    rounds.forEach(function (wg) { flat = flat.concat(wg); });
    return flat;
  }

  // ---------- game simulation ----------
  function simulateGame(homeTeam, awayTeam) {
    var homeP = personnel(homeTeam), awayP = personnel(awayTeam);
    var homeScore = 0, awayScore = 0;
    var gameLog = [];
    var possessions = 9;

    function av(p, key, def) { return (p && p.attrs && p.attrs[key] !== undefined) ? p.attrs[key] : (def || 45); }
    function avgAttr(list, key, fallback) {
      if (!list || list.length === 0) return fallback;
      var sum = 0;
      for (var i = 0; i < list.length; i++) sum += av(list[i], key, fallback);
      return sum / list.length;
    }

    function attemptFG(offTeam, offP, yardsToGoal) {
      var kicker = offP.K;
      var acc = av(kicker, 'ACC', 65);
      var kickDistance = yardsToGoal + 17;
      var baseChance = clamp(1.05 - kickDistance * 0.012, 0.05, 0.98);
      var fgChance = clamp(baseChance + (acc - 70) * 0.006, 0.05, 0.98);
      if (Math.random() < fgChance) {
        gameLog.push((kicker ? kicker.name : offTeam.abbr + ' K') + ' nails a ' + kickDistance + '-yard field goal.');
        return { scorer: offTeam, points: 3 };
      }
      gameLog.push((kicker ? kicker.name : offTeam.abbr + ' K') + ' misses a ' + kickDistance + '-yard attempt.');
      return { scorer: null, points: 0 };
    }

    function choosePlayType(down, distance, offScheme) {
      var passChance = offScheme.passWeight;
      if (down === 2) {
        if (distance >= 8) passChance += 0.15;
        else if (distance <= 3) passChance -= 0.15;
      } else if (down === 3 || down === 4) {
        if (distance <= 2) passChance -= 0.35;
        else if (distance >= 7) passChance += 0.30;
        else passChance += 0.10;
      }
      return Math.random() < clamp(passChance, 0.1, 0.9) ? 'pass' : 'run';
    }

    function maybeInjure(player) {
      if (!player || player.id === undefined || isInjured(player)) return;
      var posRisk = POSITION_INJURY_RISK[player.position] || 1;
      var ageFactor = 1 + Math.max(0, player.age - 28) * 0.05;
      var chance = INJURY_BASE * posRisk * ageFactor;
      if (Math.random() >= chance) return;
      var roll = Math.random() * 100;
      var acc = 0, sev = INJURY_SEVERITY[INJURY_SEVERITY.length - 1];
      for (var i = 0; i < INJURY_SEVERITY.length; i++) {
        acc += INJURY_SEVERITY[i].weight;
        if (roll < acc) { sev = INJURY_SEVERITY[i]; break; }
      }
      var weeks = rand(sev.weeksMin, sev.weeksMax);
      player.injuryUntilWeek = state.week + weeks;
      player.injuryLabel = sev.label;
      gameLog.push(player.name + ' goes down with an injury (' + sev.label + ').');
    }

    function resolvePassPlay(offTeam, defTeam, offP, defP, isHome, down, distance) {
      var homeBonus = isHome ? 2 : 0;
      var qb = offP.QB;
      var qbName = qb ? qb.name : (offTeam.abbr + ' QB');
      var qbArm = av(qb, 'ARM', 60), qbAcc = av(qb, 'ACC', 60), qbMob = av(qb, 'MOB', 60);
      var offScheme = OFFENSE_SCHEMES[offTeam.offScheme] || OFFENSE_SCHEMES.balanced;
      var defScheme = DEFENSE_SCHEMES[defTeam.defScheme] || DEFENSE_SCHEMES.balanced;
      var pblkAssist = (avgAttr(offP.OLs, 'PBLK', 55) - 55) * 0.4;
      if (offP.TEs && offP.TEs.length > 1) pblkAssist += (av(offP.TEs[1], 'RBLK', 55) - 55) * 0.15;
      var rushPressure = (avgAttr(defP.DLs, 'PRUSH', 55) - 55) * 0.4 * defScheme.pressureMult;
      var netPressure = rushPressure - pblkAssist;

      maybeInjure(qb);
      maybeInjure(choice(offP.OLs));
      if (offP.TEs && offP.TEs.length > 1) maybeInjure(offP.TEs[1]);
      maybeInjure(choice((defP.DLs || []).concat(defP.LBs || [])));
      var pSack = clamp((0.032 + netPressure * 0.012 - (qbMob - 70) * 0.0035) * offScheme.sackMult, 0.01, 0.35);
      if (Math.random() < pSack) {
        var rusher = (defP.DLs && defP.DLs[0]) || (defP.LBs && defP.LBs[0]);
        maybeInjure(rusher);
        var pScramble = clamp((qbMob - 60) * 0.012, 0, 0.35);
        if (Math.random() < pScramble) {
          gameLog.push(qbName + ' escapes the rush and scrambles for a few yards.');
          return { yards: rand(0, 6), turnover: false, defTD: false };
        }
        gameLog.push((rusher ? rusher.name : defTeam.abbr + ' defense') + ' sacks ' + qbName + '!');
        return { yards: -rand(3, 8), turnover: false, defTD: false };
      }

      var pDeep = clamp(0.18 + offScheme.deepBias + (qbArm - 70) * 0.006, 0.05, 0.55);
      if (down >= 3 && distance >= 12) pDeep += 0.15;
      if (down <= 2 && distance <= 3) pDeep -= 0.10;
      var isDeep = Math.random() < clamp(pDeep, 0.03, 0.7);
      var targets = offP.WRs.concat(offP.TEs || []);
      if (targets.length === 0) targets = [{ name: offTeam.abbr + ' receiver', attrs: { SPD: 50, SIZE: 50, HANDS: 50 } }];
      var target;
      if (isDeep) {
        target = targets.slice().sort(function (a, b) { return Math.max(av(b, 'SPD', 50), av(b, 'SIZE', 50)) - Math.max(av(a, 'SPD', 50), av(a, 'SIZE', 50)); })[0];
      } else {
        target = targets.slice().sort(function (a, b) { return av(b, 'HANDS', 50) - av(a, 'HANDS', 50); })[0];
      }
      var isBigTarget = av(target, 'SIZE', 50) >= av(target, 'SPD', 50);
      var isTE = (offP.TEs || []).indexOf(target) >= 0;
      var defender;
      if (isTE) {
        defender = (defP.LBs || []).concat(defP.Ss || []).sort(function (a, b) { return av(b, 'COV', 50) - av(a, 'COV', 50); })[0];
      } else {
        var wrIdx = offP.WRs.indexOf(target);
        if (defP.CBs && wrIdx >= 0 && wrIdx < defP.CBs.length) {
          defender = defP.CBs[wrIdx];
        } else {
          defender = (defP.LBs || []).concat(defP.Ss || []).sort(function (a, b) { return av(b, 'COV', 50) - av(a, 'COV', 50); })[0]
            || (defP.CBs && defP.CBs[defP.CBs.length - 1]) || null;
        }
      }
      var defPhys = av(defender, 'SIZE', av(defender, 'RSUP', 55));
      var defSpd = av(defender, 'SPD', av(defender, 'RANGE', 55));
      var defCov = av(defender, 'COV', 55);
      var edge = isBigTarget ? (av(target, 'SIZE', 50) - defPhys) : (av(target, 'SPD', 50) - defSpd);
      edge += (qbAcc - 70) * 0.15;
      edge -= (defCov - 70) * 0.1;
      edge += homeBonus;
      edge -= netPressure * 0.5;
      edge -= defScheme.coverageShift;
      if (!isDeep) edge += offScheme.shortEdgeBonus;
      if (isDeep) {
        var bestS = defP.Ss && defP.Ss[0];
        edge -= clamp((av(bestS, 'RANGE', 55) - 70) * 0.05, 0, 4) * defScheme.safetyHelpMult;
      }
      maybeInjure(target);
      maybeInjure(defender);
      var baseCompletion = isDeep ? 0.46 : 0.72;
      var success = Math.random() < clamp(baseCompletion + edge * 0.012, 0.12, 0.92);
      var targetName = target.name || (offTeam.abbr + ' receiver');
      var defName = defender ? defender.name : (defTeam.abbr + ' coverage');
      if (success) {
        var yards;
        if (isDeep) {
          yards = clamp(Math.round(18 + edge * 0.3 + rand(-5, 12)), 4, 70);
          gameLog.push(targetName + (isBigTarget ? ' out-muscles ' : ' burns ') + defName + ' for a gain of ' + yards + '.');
        } else {
          yards = clamp(Math.round(7 + edge * 0.15 + rand(-3, 7)), -2, 20);
          gameLog.push(targetName + ' hauls it in against ' + defName + ' for ' + yards + ' yards.');
        }
        return { yards: yards, turnover: false, defTD: false };
      }
      var intercepted = Math.random() < 0.15;
      if (intercepted) {
        if (Math.random() < 0.08) {
          gameLog.push(defName + ' picks it off and takes it to the house!');
          return { yards: 0, turnover: true, defTD: true };
        }
        gameLog.push('Pass intended for ' + targetName + ' - intercepted by ' + defName + '!');
        return { yards: 0, turnover: true, defTD: false };
      }
      gameLog.push('Pass intended for ' + targetName + ' - defended by ' + defName + '.');
      return { yards: 0, turnover: false, defTD: false };
    }

    function resolveRunPlay(offTeam, defTeam, offP, defP, isHome) {
      var homeBonus = isHome ? 2 : 0;
      var offScheme = OFFENSE_SCHEMES[offTeam.offScheme] || OFFENSE_SCHEMES.balanced;
      var rb = offP.RB || { name: offTeam.abbr + ' RB', attrs: { SPD: 50, POW: 50, VIS: 50 } };
      var rbSpd = av(rb, 'SPD', 50), rbPow = av(rb, 'POW', 50);
      maybeInjure(rb);
      maybeInjure(offP.RB2);
      maybeInjure(choice(offP.OLs));
      maybeInjure(choice((defP.DLs || []).concat(defP.LBs || [], defP.Ss || [])));
      var runBlockAssist = (avgAttr(offP.OLs, 'RBLK', 55) - 55) * 0.4 + offScheme.runFrontBonus;
      if (offP.TEs && offP.TEs.length > 1) runBlockAssist += (av(offP.TEs[1], 'RBLK', 55) - 55) * 0.25;
      if (offP.RB2) runBlockAssist += (av(offP.RB2, 'POW', 55) - 55) * 0.2;
      var front = (avgAttr(defP.DLs, 'RSTOP', 55) + avgAttr(defP.LBs, 'RSTOP', 55)) / 2 - runBlockAssist;
      var contain = (avgAttr(defP.Ss, 'RANGE', 55) + avgAttr(defP.LBs, 'RSTOP', 55)) / 2 - runBlockAssist * 0.5;
      var fumble = Math.random() < 0.015;
      if (rbSpd > rbPow) {
        var pBreak = clamp((rbSpd - contain) * 0.01, 0, 0.18);
        if (Math.random() < pBreak) {
          var breakYards = rand(20, 60);
          gameLog.push(rb.name + ' breaks free for ' + breakYards + ' yards!');
          return { yards: breakYards, turnover: false, defTD: false };
        }
        var yards1 = clamp(Math.round(1 + (rbSpd - front) * 0.10 + rand(-2, 3) + homeBonus * 0.2), -4, 9);
        gameLog.push(rb.name + ' picks up ' + yards1 + ' yards.');
        return { yards: yards1, turnover: fumble, defTD: false };
      }
      var breakTackle = Math.random() < clamp((rbPow - 70) * 0.006, 0, 0.15);
      var yards2 = clamp(Math.round(3 + (rbPow - front) * 0.15 + rand(-1, 3) + homeBonus * 0.2) + (breakTackle ? rand(5, 15) : 0), -3, 25);
      gameLog.push(rb.name + (breakTackle ? ' breaks a tackle and grinds out ' : ' powers ahead for ') + yards2 + ' yards.');
      return { yards: yards2, turnover: fumble, defTD: false };
    }

    function possession(offTeam, defTeam, offP, defP, isHome) {
      if (Math.random() < 0.05) {
        var dPlayer = choice((defP.DLs || []).concat(defP.LBs || [], defP.CBs || [], defP.Ss || [])) || { name: defTeam.abbr + ' defense' };
        gameLog.push(dPlayer.name + ' takes it back for ' + defTeam.abbr + '! Defensive touchdown.');
        return { scorer: defTeam, points: 7 };
      }
      var offScheme = OFFENSE_SCHEMES[offTeam.offScheme] || OFFENSE_SCHEMES.balanced;
      var down = 1, distance = 10, yardsToGoal = rand(70, 80);
      var maxPlays = 20;
      for (var playNum = 0; playNum < maxPlays; playNum++) {
        if (down === 4) {
          var inFGRange = yardsToGoal <= 40;
          var shortYardage = distance <= 2;
          var goForItChance = 0.45 + (offTeam.offScheme === 'groundpound' ? 0.10 : 0) - (offTeam.offScheme === 'airraid' ? 0.05 : 0);
          var goForIt = shortYardage && Math.random() < (inFGRange ? 0.25 : goForItChance);
          if (!goForIt) {
            if (inFGRange) return attemptFG(offTeam, offP, yardsToGoal);
            gameLog.push(offTeam.abbr + ' punts it away.');
            return { scorer: null, points: 0 };
          }
        }
        var playType = choosePlayType(down, distance, offScheme);
        var result = playType === 'pass'
          ? resolvePassPlay(offTeam, defTeam, offP, defP, isHome, down, distance)
          : resolveRunPlay(offTeam, defTeam, offP, defP, isHome);

        if (result.defTD) return { scorer: defTeam, points: 7 };
        if (result.turnover) {
          gameLog.push(offTeam.abbr + ' turns it over.');
          return { scorer: null, points: 0 };
        }

        yardsToGoal -= result.yards;
        if (yardsToGoal <= 0) {
          gameLog.push(offTeam.abbr + ' punches it in. Touchdown!');
          return { scorer: offTeam, points: 7 };
        }

        if (result.yards >= distance) {
          down = 1;
          distance = Math.min(10, yardsToGoal);
        } else {
          distance -= result.yards;
          down += 1;
          if (down > 4) {
            gameLog.push(offTeam.abbr + ' turns it over on downs.');
            return { scorer: null, points: 0 };
          }
        }
      }
      return { scorer: null, points: 0 };
    }

    for (var i = 0; i < possessions; i++) {
      var r1 = possession(homeTeam, awayTeam, homeP, awayP, true);
      if (r1.scorer === homeTeam) homeScore += r1.points; else if (r1.scorer === awayTeam) awayScore += r1.points;
      var r2 = possession(awayTeam, homeTeam, awayP, homeP, false);
      if (r2.scorer === homeTeam) homeScore += r2.points; else if (r2.scorer === awayTeam) awayScore += r2.points;
    }
    var extra = 0;
    while (homeScore === awayScore && extra < 4) {
      var rh = possession(homeTeam, awayTeam, homeP, awayP, true);
      if (rh.scorer === homeTeam) homeScore += rh.points; else if (rh.scorer === awayTeam) awayScore += rh.points;
      var ra = possession(awayTeam, homeTeam, awayP, homeP, false);
      if (ra.scorer === homeTeam) homeScore += ra.points; else if (ra.scorer === awayTeam) awayScore += ra.points;
      extra++;
    }
    gameLog.push('FINAL: ' + homeTeam.abbr + ' ' + homeScore + ' - ' + awayTeam.abbr + ' ' + awayScore);
    return { homeScore: homeScore, awayScore: awayScore, log: gameLog };
  }

  function applyResult(team, forScore, againstScore) {
    team.pf += forScore; team.pa += againstScore;
    if (forScore > againstScore) team.record.w++;
    else if (forScore < againstScore) team.record.l++;
    else team.record.t++;
  }

  function simWeek() {
    var games = state.schedule.filter(function (g) { return g.week === state.week && !g.played; });
    games.forEach(function (g) {
      var home = state.teams[g.homeId], away = state.teams[g.awayId];
      var result = simulateGame(home, away);
      g.homeScore = result.homeScore; g.awayScore = result.awayScore; g.log = result.log; g.played = true;
      applyResult(home, result.homeScore, result.awayScore);
      applyResult(away, result.awayScore, result.homeScore);
      if (g.homeId === state.userTeamId || g.awayId === state.userTeamId) {
        log('Week ' + state.week + ': ' + home.abbr + ' ' + result.homeScore + ' - ' + away.abbr + ' ' + result.awayScore);
      }
    });
    state.trainingPoints = Math.min(40, state.trainingPoints + 5);
    var totalWeeks = state.teams.length - 1;
    if (state.week >= totalWeeks) {
      startPlayoffs();
    } else {
      state.week++;
      processInjuryRecovery();
    }
    save();
  }

  function processInjuryRecovery() {
    state.teams.forEach(function (team) {
      team.roster.forEach(function (pid) {
        var p = state.players[pid];
        if (p.injuryUntilWeek && state.week > p.injuryUntilWeek) {
          if (team.isUser) log(p.name + ' is fully recovered from injury.');
          p.injuryUntilWeek = 0;
          p.injuryLabel = null;
        }
      });
    });
  }

  function standings() {
    return state.teams.slice().sort(function (a, b) {
      if (b.record.w !== a.record.w) return b.record.w - a.record.w;
      return (b.pf - b.pa) - (a.pf - a.pa);
    });
  }

  function startPlayoffs() {
    var seeds = standings().slice(0, 4).map(function (t) { return t.id; });
    state.playoffs = {
      round: 'semis',
      semis: [
        { homeId: seeds[0], awayId: seeds[3], played: false, homeScore: 0, awayScore: 0, log: [] },
        { homeId: seeds[1], awayId: seeds[2], played: false, homeScore: 0, awayScore: 0, log: [] }
      ],
      final: null, champion: null
    };
    state.phase = 'playoffs';
    state.screen = 'playoffs';
    log('Regular season complete! Playoffs begin: seeds ' + seeds.map(function (id) { return state.teams[id].abbr; }).join(', '));
    save();
  }

  function simPlayoffRound() {
    var po = state.playoffs;
    if (po.round === 'semis') {
      po.semis.forEach(function (g) {
        var home = state.teams[g.homeId], away = state.teams[g.awayId];
        var r = simulateGame(home, away);
        g.homeScore = r.homeScore; g.awayScore = r.awayScore; g.log = r.log; g.played = true;
      });
      var w1 = po.semis[0].homeScore > po.semis[0].awayScore ? po.semis[0].homeId : po.semis[0].awayId;
      var w2 = po.semis[1].homeScore > po.semis[1].awayScore ? po.semis[1].homeId : po.semis[1].awayId;
      po.final = { homeId: w1, awayId: w2, played: false, homeScore: 0, awayScore: 0, log: [] };
      po.round = 'final';
      log('Semifinal results are in. The championship matchup is set.');
    } else if (po.round === 'final') {
      var home = state.teams[po.final.homeId], away = state.teams[po.final.awayId];
      var rf = simulateGame(home, away);
      po.final.homeScore = rf.homeScore; po.final.awayScore = rf.awayScore; po.final.log = rf.log; po.final.played = true;
      var champId = rf.homeScore > rf.awayScore ? po.final.homeId : po.final.awayId;
      po.champion = champId;
      po.round = 'done';
      state.history.unshift({ year: state.year, champion: champId });
      log(state.teams[champId].name + ' win the Year ' + state.year + ' Championship!');
      startOffseason();
    }
    save();
  }

  // ---------- offseason ----------
  function startOffseason() {
    state.phase = 'offseason';
    state.screen = 'offseason';
    save();
  }

  function resignPlayer(playerId, years) {
    var team = state.teams[state.userTeamId];
    var p = state.players[playerId];
    var salary = salaryFor(p.overall, p.age);
    if (salary > capSpace(team) + p.salary) return false;
    p.salary = salary; p.yearsLeft = years;
    log('Re-signed ' + p.name + ' for ' + salary + 'M x' + years + 'yr.');
    save();
    return true;
  }

  function letWalk(playerId) {
    var team = state.teams[state.userTeamId];
    var p = state.players[playerId];
    removeFromRoster(team, playerId);
    p.teamId = null; p.yearsLeft = 0; p.salary = 0;
    state.freeAgents.push(playerId);
    log(p.name + ' departs in free agency.');
    save();
  }

  function releasePlayer(playerId) {
    var team = state.teams[state.userTeamId];
    var p = state.players[playerId];
    removeFromRoster(team, playerId);
    p.teamId = null; p.yearsLeft = 0; p.salary = 0;
    state.freeAgents.push(playerId);
    log('Released ' + p.name + '.');
    save();
  }

  function expiringUserPlayers() {
    var team = state.teams[state.userTeamId];
    return team.roster.map(function (id) { return state.players[id]; }).filter(function (p) { return p.yearsLeft <= 1; });
  }

  function proceedToNewYear() {
    Object.keys(state.players).forEach(function (pid) {
      var p = state.players[pid];
      p.injuryUntilWeek = 0;
      p.injuryLabel = null;
    });
    state.teams.forEach(function (team) {
      team.roster.slice().forEach(function (pid) {
        var p = state.players[pid];
        p.yearsLeft -= 1;
        if (p.yearsLeft <= 0) {
          if (team.isUser) {
            removeFromRoster(team, pid);
            p.teamId = null; p.salary = 0;
            state.freeAgents.push(pid);
          } else {
            var keepChance = clamp(0.4 + (p.overall - 60) * 0.01, 0.1, 0.85);
            var newSalary = salaryFor(p.overall, p.age);
            if (Math.random() < keepChance && newSalary <= capSpace(team) + p.salary) {
              p.salary = newSalary; p.yearsLeft = rand(1, 3);
            } else {
              removeFromRoster(team, pid);
              p.teamId = null; p.salary = 0;
              state.freeAgents.push(pid);
            }
          }
        }
      });
    });

    state.teams.forEach(function (team) {
      team.roster.forEach(function (pid) {
        var p = state.players[pid];
        p.age += 1;
        var keys = POSITION_ATTRS[p.position];
        if (p.age <= 24) {
          if (p.overall < p.potential && Math.random() < 0.6) bumpAttr(p, choice(keys), rand(1, 3));
        } else if (p.age <= 29) {
          if (Math.random() < 0.3) bumpAttr(p, choice(keys), rand(-1, 1));
        } else {
          var declineChance = clamp((p.age - 29) * 0.12, 0.1, 0.7);
          if (Math.random() < declineChance) bumpAttr(p, choice(keys), -rand(1, 3));
        }
      });
      while (team.roster.length > ROSTER_MAX) {
        var worst = team.roster.map(function (id) { return state.players[id]; })
          .sort(function (a, b) { return a.overall - b.overall; })[0];
        removeFromRoster(team, worst.id);
        worst.teamId = null; worst.salary = 0; worst.yearsLeft = 0;
        if (team.isUser) state.freeAgents.push(worst.id);
      }
      team.cap += CAP_GROWTH_PER_YEAR;
      team.record = { w: 0, l: 0, t: 0 }; team.pf = 0; team.pa = 0;
    });

    state.year += 1;
    startDraft(4);
    var fresh = [];
    for (var i = 0; i < 20; i++) {
      var fa = generateVeteran();
      state.players[fa.id] = fa;
      fresh.push(fa.id);
    }
    state.freeAgents = state.freeAgents.concat(fresh);
    log('Year ' + state.year + ' begins. The draft is underway.');
    save();
  }

  // ---------- training ----------
  function trainPlayer(playerId) {
    var team = state.teams[state.userTeamId];
    var p = state.players[playerId];
    if (state.trainingPoints < 3) return false;
    if (p.overall >= p.potential) return false;
    state.trainingPoints -= 3;
    var chance = 0.5;
    if (p.age <= 24) chance += 0.2;
    if (p.age >= 30) chance -= 0.2;
    if (Math.random() < chance) {
      var key = choice(POSITION_ATTRS[p.position]);
      bumpAttr(p, key, 1);
      log('Training session paid off: ' + p.name + '\'s ' + ATTR_LABELS[key] + ' improves (now ' + p.overall + ' OVR).');
    } else {
      log('Training session with ' + p.name + ' showed no gains this time.');
    }
    save();
    return true;
  }

  // ---------- rendering ----------
  function h(str) { var d = document.createElement('div'); d.textContent = str; return d.innerHTML; }

  function render() {
    var app = document.getElementById('app');
    if (!state) { app.innerHTML = startScreenHtml(); wireStartScreen(); return; }
    app.innerHTML = tabsHtml() + screenHtml();
    wireGlobal();
  }

  var pendingTeamSel = 0;
  var pendingTrade = { partnerId: null, sendPlayers: {}, sendPicks: {}, receivePlayers: {}, receivePicks: {} };

  function startScreenHtml() {
    var opts = TEAMS_SEED.map(function (seed, i) {
      return '<div class="teamopt' + (i === pendingTeamSel ? ' sel' : '') + '" data-team="' + i + '">' +
        '<div style="font-weight:600">' + seed.city + '</div><div class="muted">' + seed.mascot + '</div></div>';
    }).join('');
    return '<div class="startscreen">' +
      '<h1>GRIDIRON DYNASTY</h1>' +
      '<p class="muted">Draft. Scout. Sign. Build a dynasty from nothing.</p>' +
      '<h3>Choose your franchise</h3>' +
      '<div class="teamgrid">' + opts + '</div>' +
      '<button id="startBtn" style="margin-top:16px">Start Franchise</button>' +
      '</div>';
  }

  function wireStartScreen() {
    document.querySelectorAll('.teamopt').forEach(function (el) {
      el.onclick = function () { pendingTeamSel = parseInt(el.getAttribute('data-team'), 10); render(); };
    });
    document.getElementById('startBtn').onclick = function () { newGame(pendingTeamSel); render(); };
  }

  var TAB_DEFS = [
    { id: 'hub', label: 'Hub', phases: null },
    { id: 'roster', label: 'Roster', phases: null },
    { id: 'depthchart', label: 'Depth Chart', phases: null },
    { id: 'coaching', label: 'Coaching', phases: null },
    { id: 'trades', label: 'Trades', phases: null },
    { id: 'standings', label: 'Standings', phases: null },
    { id: 'draft', label: 'Draft', phases: ['draft'] },
    { id: 'freeagency', label: 'Free Agency', phases: ['freeagency'] },
    { id: 'training', label: 'Training', phases: ['season'] },
    { id: 'playoffs', label: 'Playoffs', phases: ['playoffs'] },
    { id: 'offseason', label: 'Offseason', phases: ['offseason'] }
  ];

  function tabsHtml() {
    var team = state.teams[state.userTeamId];
    var tabs = TAB_DEFS.filter(function (t) { return !t.phases || t.phases.indexOf(state.phase) >= 0; })
      .map(function (t) {
        return '<div class="tab' + (state.screen === t.id ? ' active' : '') + '" data-tab="' + t.id + '">' + t.label + '</div>';
      }).join('');
    return '<div class="row"><div><strong>' + team.name + '</strong> <span class="badge">Year ' + state.year + '</span>' +
      (state.phase === 'season' ? ' <span class="badge">Week ' + state.week + '/' + (state.teams.length - 1) + '</span>' : '') +
      '</div><div class="muted">Cap: ' + capSpace(team) + 'M / ' + team.cap + 'M</div></div>' +
      '<div class="tabs">' + tabs + '</div>';
  }

  function screenHtml() {
    switch (state.screen) {
      case 'roster': return rosterHtml();
      case 'depthchart': return depthChartHtml();
      case 'coaching': return coachingHtml();
      case 'trades': return tradesHtml();
      case 'standings': return standingsHtml();
      case 'draft': return draftHtml();
      case 'freeagency': return freeAgencyHtml();
      case 'training': return trainingHtml();
      case 'playoffs': return playoffsHtml();
      case 'offseason': return offseasonHtml();
      default: return hubHtml();
    }
  }

  function hubHtml() {
    var team = state.teams[state.userTeamId];
    var off = offenseRating(team).toFixed(1), def = defenseRating(team).toFixed(1);
    var nextGame = state.schedule.filter(function (g) { return g.week === state.week && !g.played && (g.homeId === team.id || g.awayId === team.id); })[0];
    var gameCard = '';
    if (state.phase === 'season' && nextGame) {
      var oppId = nextGame.homeId === team.id ? nextGame.awayId : nextGame.homeId;
      var opp = state.teams[oppId];
      var isHome = nextGame.homeId === team.id;
      gameCard = '<div class="card"><h3>This Week</h3><div class="row"><div>' + (isHome ? 'vs' : '@') + ' ' + opp.name + '</div>' +
        '<button id="simWeekBtn">Simulate Week</button></div>' +
        '<div class="muted">Scouting: ' + OFFENSE_SCHEMES[opp.offScheme].label + ' offense / ' + DEFENSE_SCHEMES[opp.defScheme].label + ' defense</div></div>';
    } else if (state.phase === 'season') {
      gameCard = '<div class="card"><div class="row"><div>Week ' + state.week + ' games ready.</div><button id="simWeekBtn">Simulate Week</button></div></div>';
    }
    var histHtml = state.history.length ? state.history.slice(0, 5).map(function (hh) {
      return '<div class="row"><span>Year ' + hh.year + '</span><span>' + state.teams[hh.champion].name + '</span></div>';
    }).join('') : '<div class="muted">No champions yet.</div>';
    var injuredList = team.roster.map(function (id) { return state.players[id]; }).filter(isInjured);
    var injuryCard = injuredList.length ? '<div class="card"><h3>Injury Report</h3>' + injuredList.map(function (p) {
      return '<div class="row"><span>' + p.name + ' (' + p.position + ')</span><span class="muted">' + p.injuryLabel + ' - ' + Math.max(1, p.injuryUntilWeek - state.week) + 'wk</span></div>';
    }).join('') + '</div>' : '';
    return gameCard + injuryCard +
      '<div class="card"><h3>Team Strength</h3><div class="row"><span>Offense</span><span>' + off + '</span></div>' +
      '<div class="row"><span>Defense</span><span>' + def + '</span></div>' +
      '<div class="row"><span>Roster Size</span><span>' + team.roster.length + ' / ' + ROSTER_MAX + '</span></div></div>' +
      '<div class="card"><h3>Recent News</h3><div class="log">' + state.log.slice(0, 12).map(h).join('<br>') + '</div></div>' +
      '<div class="card"><h3>Championship History</h3>' + histHtml + '</div>' +
      '<div class="card"><button class="danger" id="resetBtn">New Game (reset all progress)</button></div>';
  }

  function playerRow(p, actionsHtml, showTeam, statsText) {
    var teamTag = showTeam && p.teamId !== null ? ' <span class="muted">' + state.teams[p.teamId].abbr + '</span>' : '';
    var stats = statsText || formatStats(p);
    var injuryTag = isInjured(p) ? ' <span class="badge pill-bad">' + p.injuryLabel + ' (' + Math.max(1, p.injuryUntilWeek - state.week) + 'wk)</span>' : '';
    return '<div class="prow"><div><span class="pname">' + h(p.name) + '</span>' +
      ' <span class="badge">' + p.position + '</span>' + injuryTag + ' <span class="muted">Age ' + p.age + '</span>' + teamTag +
      '<div class="muted">' + stats + (p.salary ? ' &middot; ' + p.salary + 'M x' + p.yearsLeft + 'yr' : '') + '</div></div>' +
      '<div>' + (actionsHtml || '') + '</div></div>';
  }

  function rosterHtml() {
    var team = state.teams[state.userTeamId];
    var players = team.roster.map(function (id) { return state.players[id]; })
      .sort(function (a, b) { return POSITIONS.indexOf(a.position) - POSITIONS.indexOf(b.position) || b.overall - a.overall; });
    var rows = players.map(function (p) {
      return playerRow(p, '<button class="secondary" data-release="' + p.id + '">Release</button>');
    }).join('');
    return '<div class="card"><h2>Roster (' + players.length + ')</h2><div class="plist">' + (rows || '<div class="muted">Empty roster.</div>') + '</div></div>';
  }

  function depthChartHtml() {
    var team = state.teams[state.userTeamId];
    var cards = POSITIONS.map(function (pos) {
      ensureDepthOrder(team, pos);
      var list = fullDepthOrder(team, pos);
      if (list.length === 0) return '';
      var rows = list.map(function (p, i) {
        var upBtn = '<button class="secondary" data-depth-up="' + pos + ':' + p.id + '" ' + (i === 0 ? 'disabled' : '') + '>&uarr;</button>';
        var downBtn = '<button class="secondary" data-depth-down="' + pos + ':' + p.id + '" ' + (i === list.length - 1 ? 'disabled' : '') + '>&darr;</button>';
        return playerRow(p, upBtn + ' ' + downBtn);
      }).join('');
      return '<div class="card"><h3>' + pos + '</h3><div class="plist">' + rows + '</div></div>';
    }).join('');
    return '<div class="card"><h2>Depth Chart</h2><p class="muted">Reorder your own starters - the top of each list plays. New signings/draftees start at the bottom.</p></div>' + cards;
  }

  function coachingHtml() {
    var team = state.teams[state.userTeamId];
    function opts(map, current, selId) {
      return Object.keys(map).map(function (k) {
        return '<option value="' + k + '"' + (current === k ? ' selected' : '') + '>' + map[k].label + '</option>';
      }).join('');
    }
    var report = state.teams.map(function (t) {
      return '<div class="row"><span>' + (t.isUser ? '<strong>' + t.name + '</strong>' : t.name) + '</span>' +
        '<span class="muted">' + OFFENSE_SCHEMES[t.offScheme].label + ' / ' + DEFENSE_SCHEMES[t.defScheme].label +
        ' &middot; ' + OFFENSE_PACKAGES[t.offPackage].label + ' / ' + DEFENSE_PACKAGES[t.defPackage].label + '</span></div>';
    }).join('');
    return '<div class="card"><h2>Coaching</h2>' +
      '<h3>Offensive Scheme</h3><select id="offSchemeSel">' + opts(OFFENSE_SCHEMES, team.offScheme) + '</select>' +
      '<p class="muted">' + OFFENSE_SCHEMES[team.offScheme].desc + '</p>' +
      '<h3>Defensive Scheme</h3><select id="defSchemeSel">' + opts(DEFENSE_SCHEMES, team.defScheme) + '</select>' +
      '<p class="muted">' + DEFENSE_SCHEMES[team.defScheme].desc + '</p>' +
      '<h3>Offensive Package</h3><select id="offPackageSel">' + opts(OFFENSE_PACKAGES, team.offPackage) + '</select>' +
      '<p class="muted">' + OFFENSE_PACKAGES[team.offPackage].desc + '</p>' +
      '<h3>Defensive Package</h3><select id="defPackageSel">' + opts(DEFENSE_PACKAGES, team.defPackage) + '</select>' +
      '<p class="muted">' + DEFENSE_PACKAGES[team.defPackage].desc + '</p></div>' +
      '<div class="card"><h3>League Scouting Report</h3>' + report + '</div>';
  }

  function tradeAssetRow(group, kind, key, label, sub, value) {
    var checked = pendingTrade[group][key] ? 'checked' : '';
    return '<div class="prow"><label style="display:flex;align-items:center;gap:8px;width:100%;cursor:pointer">' +
      '<input type="checkbox" data-trade="' + group + ':' + key + '" ' + checked + '>' +
      '<span style="flex:1"><span class="pname">' + label + '</span>' +
      '<div class="muted">' + sub + ' &middot; Value ' + value + '</div></span></label></div>';
  }

  function tradeSideHtml(team, group, playersGroup, picksGroup) {
    var playerRows = team.roster.map(function (id) { return state.players[id]; }).map(function (p) {
      return tradeAssetRow(playersGroup, 'player', p.id, h(p.name) + ' <span class="badge">' + p.position + '</span>', formatStats(p), playerValue(p));
    }).join('');
    var pickRows = tradeablePicksFor(team.id).map(function (idx) {
      var round = Math.floor(idx / state.teams.length) + 1;
      return tradeAssetRow(picksGroup, 'pick', idx, 'Round ' + round + ', Pick #' + (idx + 1), 'Draft pick', pickValue(idx));
    }).join('');
    return '<div class="plist">' + (playerRows + pickRows || '<div class="muted">Nothing available.</div>') + '</div>';
  }

  function tradesHtml() {
    var userTeam = state.teams[state.userTeamId];
    var partnerOpts = '<option value="">Select a team...</option>' + state.teams.filter(function (t) { return !t.isUser; }).map(function (t) {
      return '<option value="' + t.id + '"' + (pendingTrade.partnerId === t.id ? ' selected' : '') + '>' + t.name + '</option>';
    }).join('');
    var body = '';
    if (pendingTrade.partnerId !== null) {
      var partner = state.teams[pendingTrade.partnerId];
      var sendValue = sideValue(Object.keys(pendingTrade.sendPlayers), Object.keys(pendingTrade.sendPicks).map(Number));
      var receiveValue = sideValue(Object.keys(pendingTrade.receivePlayers), Object.keys(pendingTrade.receivePicks).map(Number));
      body =
        '<div class="card"><h3>Your Offer <span class="muted">(value ' + sendValue + ')</span></h3>' +
        tradeSideHtml(userTeam, 'send', 'sendPlayers', 'sendPicks') + '</div>' +
        '<div class="card"><h3>You Receive from ' + partner.name + ' <span class="muted">(value ' + receiveValue + ')</span></h3>' +
        tradeSideHtml(partner, 'receive', 'receivePlayers', 'receivePicks') + '</div>' +
        '<div class="card"><button id="proposeTradeBtn">Propose Trade</button></div>';
    }
    return '<div class="card"><h2>Trades</h2>' +
      (state.phase !== 'draft' ? '<p class="muted">Draft picks can only be traded during the draft.</p>' : '') +
      '<h3>Trade Partner</h3><select id="tradePartnerSel">' + partnerOpts + '</select></div>' + body;
  }

  function standingsHtml() {
    var rows = standings().map(function (t, i) {
      return '<tr><td>' + (i + 1) + '</td><td>' + (t.isUser ? '<strong>' + t.name + '</strong>' : t.name) + '</td>' +
        '<td>' + t.record.w + '-' + t.record.l + (t.record.t ? '-' + t.record.t : '') + '</td>' +
        '<td>' + t.pf + '</td><td>' + t.pa + '</td></tr>';
    }).join('');
    var upcoming = state.schedule.filter(function (g) { return !g.played; }).slice(0, 8).map(function (g) {
      return '<div class="row"><span>Wk ' + g.week + '</span><span>' + state.teams[g.homeId].abbr + ' vs ' + state.teams[g.awayId].abbr + '</span></div>';
    }).join('');
    var played = state.schedule.filter(function (g) { return g.played; }).slice(-8).reverse().map(function (g) {
      return '<div class="row"><span>Wk ' + g.week + '</span><span>' + state.teams[g.homeId].abbr + ' ' + g.homeScore + ' - ' + g.awayScore + ' ' + state.teams[g.awayId].abbr + '</span></div>';
    }).join('');
    return '<div class="card"><h2>Standings</h2><table><tr><th>#</th><th>Team</th><th>Rec</th><th>PF</th><th>PA</th></tr>' + rows + '</table></div>' +
      (state.schedule.length ? '<div class="card"><h3>Recent Results</h3>' + (played || '<div class="muted">No games yet.</div>') + '</div>' +
      '<div class="card"><h3>Upcoming</h3>' + (upcoming || '<div class="muted">Season complete.</div>') + '</div>' : '');
  }

  function draftHtml() {
    var d = state.draft;
    if (!d) return '<div class="card">No draft in progress.</div>';
    var onClock = currentPickTeamId();
    var team = onClock !== null ? state.teams[onClock] : null;
    var pickInfo = onClock === null ? '<div class="muted">Draft complete.</div>' :
      '<div class="row"><span>On the clock: <strong>' + team.name + '</strong> (Pick ' + (d.pickIndex + 1) + '/' + d.order.length + ')</span>' +
      (team.isUser ? '' : '<button id="advanceDraftBtn">Advance</button>') + '</div>';
    var isUserTurn = onClock === state.userTeamId;
    var list = '';
    if (isUserTurn) {
      var sorted = d.class.map(function (id) { return state.players[id]; }).sort(function (a, b) {
        return POSITIONS.indexOf(a.position) - POSITIONS.indexOf(b.position) || a.name.localeCompare(b.name);
      });
      list = sorted.map(function (p) {
        var cost = p.scoutLevel < 3 ? SCOUT_COST[p.scoutLevel] : null;
        var scoutBtn = cost !== null ? '<button class="secondary" data-scout="' + p.id + '" ' + (d.scoutBudget < cost ? 'disabled' : '') + '>Scout (' + cost + ')</button>' : '';
        return playerRow(p, scoutBtn + ' <button data-draft="' + p.id + '">Draft</button>', false, formatScoutedStats(p));
      }).join('');
    }
    return '<div class="card"><h2>Draft — Year ' + state.year + '</h2>' + pickInfo +
      (onClock !== null ? '<div class="muted">Scouting budget: ' + d.scoutBudget + ' &middot; <button class="secondary" id="simRestDraftBtn">Sim Rest of Draft</button></div>' : '') +
      '</div>' +
      (isUserTurn ? '<div class="card"><h3>Available Prospects (' + d.class.length + ')</h3><div class="plist">' + list + '</div></div>' : '');
  }

  function freeAgencyHtml() {
    var team = state.teams[state.userTeamId];
    var list = state.freeAgents.map(function (id) { return state.players[id]; })
      .sort(function (a, b) { return b.overall - a.overall; });
    var rows = list.map(function (p) {
      var salary = salaryFor(p.overall, p.age);
      var afford = salary <= capSpace(team) && team.roster.length < ROSTER_MAX;
      return '<div class="prow"><div><span class="pname">' + h(p.name) + '</span> <span class="badge">' + p.position + '</span>' +
        ' <span class="muted">Age ' + p.age + '</span><div class="muted">' + formatStats(p) + ' &middot; ~' + salary + 'M/yr</div></div>' +
        '<div><select id="yrs-' + p.id + '"><option value="1">1yr</option><option value="2" selected>2yr</option><option value="3">3yr</option></select> ' +
        '<button data-sign="' + p.id + '" ' + (afford ? '' : 'disabled') + '>Sign</button></div></div>';
    }).join('');
    return '<div class="card"><h2>Free Agency</h2><div class="row"><span class="muted">' + list.length + ' available</span>' +
      '<div><button class="secondary" id="advanceFABtn">Advance FA Period</button> <button id="startSeasonBtn">Start Season</button></div></div></div>' +
      '<div class="card"><div class="plist">' + (rows || '<div class="muted">No free agents remain.</div>') + '</div></div>';
  }

  function trainingHtml() {
    var team = state.teams[state.userTeamId];
    var players = team.roster.map(function (id) { return state.players[id]; })
      .filter(function (p) { return p.overall < p.potential; })
      .sort(function (a, b) { return (b.potential - b.overall) - (a.potential - a.overall); });
    var rows = players.map(function (p) {
      return playerRow(p, '<button data-train="' + p.id + '" ' + (state.trainingPoints < 3 ? 'disabled' : '') + '>Train (3 pts)</button>');
    }).join('');
    return '<div class="card"><h2>Training</h2><div class="row"><span>Banked Points: <strong>' + state.trainingPoints + '</strong></span></div>' +
      '<p class="muted">Spend 3 points on a session for a chance to raise a player toward their potential.</p></div>' +
      '<div class="card"><div class="plist">' + (rows || '<div class="muted">Every player is at their ceiling.</div>') + '</div></div>';
  }

  function playoffsHtml() {
    var po = state.playoffs;
    if (!po) return '<div class="card">No playoff data.</div>';
    function gameRow(g, label) {
      if (!g) return '';
      var home = state.teams[g.homeId], away = state.teams[g.awayId];
      var scoreTxt = g.played ? (home.abbr + ' ' + g.homeScore + ' - ' + g.awayScore + ' ' + away.abbr) : (home.abbr + ' vs ' + away.abbr);
      return '<div class="row"><span>' + label + '</span><span>' + scoreTxt + '</span></div>';
    }
    var actionBtn = po.round === 'done' ? '' : '<button id="simPlayoffBtn">Simulate ' + (po.round === 'semis' ? 'Semifinals' : 'Championship') + '</button>';
    var champHtml = po.champion !== null ? '<div class="card"><h2>' + state.teams[po.champion].name + ' are Champions!</h2></div>' : '';
    return '<div class="card"><h2>Playoffs</h2>' +
      gameRow(po.semis[0], 'Semifinal 1') + gameRow(po.semis[1], 'Semifinal 2') +
      (po.final ? gameRow(po.final, 'Championship') : '') +
      '<div style="margin-top:8px">' + actionBtn + '</div></div>' + champHtml;
  }

  function offseasonHtml() {
    var expiring = expiringUserPlayers();
    var rows = expiring.map(function (p) {
      var salary = salaryFor(p.overall, p.age);
      return '<div class="prow"><div><span class="pname">' + h(p.name) + '</span> <span class="badge">' + p.position + '</span>' +
        ' <span class="muted">Age ' + p.age + '</span><div class="muted">' + formatStats(p) + ' &middot; re-sign ~' + salary + 'M</div></div>' +
        '<div><select id="ryrs-' + p.id + '"><option value="1">1yr</option><option value="2" selected>2yr</option><option value="3">3yr</option></select> ' +
        '<button data-resign="' + p.id + '">Re-sign</button> <button class="secondary" data-walk="' + p.id + '">Let Walk</button></div></div>';
    }).join('');
    return '<div class="card"><h2>Offseason — Year ' + state.year + ' Complete</h2>' +
      '<p class="muted">Handle expiring contracts, then advance to next year\'s draft.</p>' +
      '<button id="proceedYearBtn">Proceed to Year ' + (state.year + 1) + '</button></div>' +
      '<div class="card"><h3>Expiring Contracts (' + expiring.length + ')</h3><div class="plist">' + (rows || '<div class="muted">No expiring contracts.</div>') + '</div></div>';
  }

  // ---------- event wiring ----------
  function wireGlobal() {
    document.querySelectorAll('[data-tab]').forEach(function (el) {
      el.onclick = function () { state.screen = el.getAttribute('data-tab'); render(); };
    });
    var resetBtn = document.getElementById('resetBtn');
    if (resetBtn) resetBtn.onclick = resetGame;

    var simWeekBtn = document.getElementById('simWeekBtn');
    if (simWeekBtn) simWeekBtn.onclick = function () { simWeek(); render(); };

    document.querySelectorAll('[data-release]').forEach(function (el) {
      el.onclick = function () { releasePlayer(parseInt(el.getAttribute('data-release'), 10)); render(); };
    });

    document.querySelectorAll('[data-depth-up]').forEach(function (el) {
      el.onclick = function () { var parts = el.getAttribute('data-depth-up').split(':'); moveDepthChart(parts[0], parseInt(parts[1], 10), -1); render(); };
    });
    document.querySelectorAll('[data-depth-down]').forEach(function (el) {
      el.onclick = function () { var parts = el.getAttribute('data-depth-down').split(':'); moveDepthChart(parts[0], parseInt(parts[1], 10), 1); render(); };
    });

    var offSchemeSel = document.getElementById('offSchemeSel');
    if (offSchemeSel) offSchemeSel.onchange = function () { state.teams[state.userTeamId].offScheme = offSchemeSel.value; save(); render(); };
    var defSchemeSel = document.getElementById('defSchemeSel');
    if (defSchemeSel) defSchemeSel.onchange = function () { state.teams[state.userTeamId].defScheme = defSchemeSel.value; save(); render(); };
    var offPackageSel = document.getElementById('offPackageSel');
    if (offPackageSel) offPackageSel.onchange = function () { state.teams[state.userTeamId].offPackage = offPackageSel.value; save(); render(); };
    var defPackageSel = document.getElementById('defPackageSel');
    if (defPackageSel) defPackageSel.onchange = function () { state.teams[state.userTeamId].defPackage = defPackageSel.value; save(); render(); };

    var tradePartnerSel = document.getElementById('tradePartnerSel');
    if (tradePartnerSel) tradePartnerSel.onchange = function () {
      var val = tradePartnerSel.value;
      pendingTrade = { partnerId: val === '' ? null : parseInt(val, 10), sendPlayers: {}, sendPicks: {}, receivePlayers: {}, receivePicks: {} };
      render();
    };
    document.querySelectorAll('[data-trade]').forEach(function (el) {
      el.onchange = function () {
        var parts = el.getAttribute('data-trade').split(':');
        var group = parts[0], key = parts[1];
        if (el.checked) pendingTrade[group][key] = true; else delete pendingTrade[group][key];
        render();
      };
    });
    var proposeTradeBtn = document.getElementById('proposeTradeBtn');
    if (proposeTradeBtn) proposeTradeBtn.onclick = function () {
      var partnerId = pendingTrade.partnerId;
      var sendPlayerIds = Object.keys(pendingTrade.sendPlayers).map(Number);
      var sendPicks = Object.keys(pendingTrade.sendPicks).map(Number);
      var receivePlayerIds = Object.keys(pendingTrade.receivePlayers).map(Number);
      var receivePicks = Object.keys(pendingTrade.receivePicks).map(Number);
      proposeTrade(partnerId, sendPlayerIds, sendPicks, receivePlayerIds, receivePicks);
      pendingTrade = { partnerId: partnerId, sendPlayers: {}, sendPicks: {}, receivePlayers: {}, receivePicks: {} };
      render();
    };

    var advanceDraftBtn = document.getElementById('advanceDraftBtn');
    if (advanceDraftBtn) advanceDraftBtn.onclick = function () { advanceDraft(); render(); };
    var simRestDraftBtn = document.getElementById('simRestDraftBtn');
    if (simRestDraftBtn) simRestDraftBtn.onclick = function () { simRestOfDraft(); render(); };
    document.querySelectorAll('[data-scout]').forEach(function (el) {
      el.onclick = function () {
        var id = parseInt(el.getAttribute('data-scout'), 10);
        var p = state.players[id];
        var cost = SCOUT_COST[p.scoutLevel];
        if (state.draft.scoutBudget >= cost) { state.draft.scoutBudget -= cost; p.scoutLevel += 1; save(); render(); }
      };
    });
    document.querySelectorAll('[data-draft]').forEach(function (el) {
      el.onclick = function () {
        var id = parseInt(el.getAttribute('data-draft'), 10);
        draftPickTo(state.userTeamId, id);
        advanceDraft();
        if (state.draft && currentPickTeamId() === null) finishDraft();
        render();
      };
    });

    document.querySelectorAll('[data-sign]').forEach(function (el) {
      el.onclick = function () {
        var id = parseInt(el.getAttribute('data-sign'), 10);
        var sel = document.getElementById('yrs-' + id);
        signFreeAgent(id, parseInt(sel.value, 10));
        render();
      };
    });
    var advanceFABtn = document.getElementById('advanceFABtn');
    if (advanceFABtn) advanceFABtn.onclick = function () { advanceFAPeriod(); render(); };
    var startSeasonBtn = document.getElementById('startSeasonBtn');
    if (startSeasonBtn) startSeasonBtn.onclick = function () { startSeason(); render(); };

    document.querySelectorAll('[data-train]').forEach(function (el) {
      el.onclick = function () { trainPlayer(parseInt(el.getAttribute('data-train'), 10)); render(); };
    });

    var simPlayoffBtn = document.getElementById('simPlayoffBtn');
    if (simPlayoffBtn) simPlayoffBtn.onclick = function () { simPlayoffRound(); render(); };

    document.querySelectorAll('[data-resign]').forEach(function (el) {
      el.onclick = function () {
        var id = parseInt(el.getAttribute('data-resign'), 10);
        var sel = document.getElementById('ryrs-' + id);
        resignPlayer(id, parseInt(sel.value, 10));
        render();
      };
    });
    document.querySelectorAll('[data-walk]').forEach(function (el) {
      el.onclick = function () { letWalk(parseInt(el.getAttribute('data-walk'), 10)); render(); };
    });
    var proceedYearBtn = document.getElementById('proceedYearBtn');
    if (proceedYearBtn) proceedYearBtn.onclick = function () { proceedToNewYear(); render(); };
  }

  // ---------- boot ----------
  state = load();
  render();
})();
</script>
</body>
</html>
