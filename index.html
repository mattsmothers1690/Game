<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Machineborn</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    margin: 0;
    overscroll-behavior: none;
  }
  body {
    background: #0b0b12;
    color: #eee;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 14px;
  }

  /* ---------------- START SCREEN ---------------- */
  #startScreen { text-align: center; padding: 40px 16px; }
  h1 {
    text-align: center;
    letter-spacing: 3px;
    font-size: 1.4rem;
    color: #a78bfa;
    margin: 8px 0 12px;
  }
  #startScreen button, .overlayBtn {
    display: block;
    font-size: 1.1rem;
    padding: 16px 32px;
    background: #7c3aed;
    color: white;
    border: none;
    border-radius: 12px;
    margin: 14px auto 0;
  }
  #startScreen button:active, .overlayBtn:active { background: #5b21b6; }
  .overlayBtn:disabled { opacity: 0.35; }

  /* ---------------- TEAM SELECT ---------------- */
  #teamSelectScreen { display: none; text-align: center; padding: 30px 16px; }
  #teamSelectCounter { color: #999; font-size: 0.85rem; margin-top: 4px; }
  #teamSelectGrid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    max-width: 700px;
    margin: 20px auto 0;
  }
  .selectCard {
    width: 130px;
    background: #15151f;
    border: 2px solid #2a2a3a;
    border-radius: 10px;
    padding: 12px 8px;
    color: #ddd;
  }
  .selectCard.selected { border-color: #a78bfa; background: #201a3a; }
  .selectCard:disabled { opacity: 0.3; }
  .selectName { font-weight: 600; font-size: 0.9rem; }
  .selectRole { font-size: 0.7rem; color: #888; margin-top: 2px; }
  .selectStats { font-size: 0.62rem; color: #777; margin-top: 6px; line-height: 1.4; }
  #teamSelectActions { display: flex; gap: 12px; justify-content: center; margin-top: 20px; }
  #teamSelectActions .overlayBtn { margin: 0; }

  /* ---------------- ROTATE HINT ---------------- */
  #rotateHint {
    display: none;
    position: fixed; inset: 0;
    background: #0b0b12;
    color: #ccc;
    z-index: 30;
    align-items: center; justify-content: center;
    flex-direction: column;
    text-align: center;
    padding: 24px;
    font-size: 1.1rem;
  }
  #rotateHint .spin { font-size: 2.2rem; margin-bottom: 12px; }

  @media (orientation: portrait) {
    body.battleActive #rotateHint { display: flex; }
    body.battleActive #battle.active { display: none; }
  }

  /* ---------------- BATTLE LAYOUT (landscape, top/bottom split) ---------------- */
  #battle {
    display: none;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
  }
  #battle.active { display: flex; }

  .unitZone {
    flex: 1 1 0;
    display: flex;
    flex-direction: row;
    gap: 4px;
    padding: 4px 6px;
    overflow-x: auto;
    min-height: 0;
  }

  .unitCard {
    flex: 1 1 0;
    min-width: 0;
    background: #15151f;
    border: 1px solid #2a2a3a;
    border-radius: 8px;
    padding: 5px 6px;
    position: relative;
    display: flex;
    flex-direction: column;
  }
  .unitCard.dead { opacity: 0.35; }
  .unitCard.targetable {
    border-color: #a78bfa;
    box-shadow: 0 0 0 2px rgba(167,139,250,0.4);
  }
  .unitCard.acting { border-color: #f59e0b; box-shadow: 0 0 0 2px rgba(245,158,11,0.5); }
  .unitTop { flex: 0 0 auto; display: flex; justify-content: space-between; align-items: baseline; gap: 4px; overflow: hidden; }
  .unitName { font-weight: 600; font-size: 0.7rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar { flex: 0 0 auto; background: #26263a; border-radius: 4px; height: 3px; margin-top: 2px; overflow: hidden; }
  .bar > div { height: 100%; }
  .hpFill { background: linear-gradient(90deg,#22c55e,#16a34a); }
  .tmFill { background: linear-gradient(90deg,#38bdf8,#0284c7); }
  .barLabel { flex: 0 0 auto; font-size: 0.5rem; color: #999; display:flex; justify-content: space-between; }
  .effects {
    flex: 1 1 auto;
    margin-top: 3px;
    display: flex;
    flex-wrap: wrap;
    align-content: flex-start;
    gap: 2px;
    overflow-y: auto;
    min-height: 0;
  }
  .effTag { flex: 0 0 auto; font-size: 0.52rem; padding: 1px 4px; border-radius: 5px; background: #23233a; border: 1px solid #3a3a55; white-space: nowrap; }
  .effTag.buff { border-color: #16a34a; color: #86efac; }
  .effTag.debuff { border-color: #b91c1c; color: #fca5a5; }

  /* ---------------- SKILL BAR (bottom, Raid-style) ---------------- */
  #actionsWrap {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    gap: 3px;
    padding: 4px 6px calc(4px + env(safe-area-inset-bottom));
    background: #12121a;
    border-top: 1px solid #2a2a3a;
  }
  #actionsWrap.waiting { align-items: center; padding-top: 10px; padding-bottom: 10px; }
  #skillRow { display: flex; flex-direction: row; gap: 4px; }
  .skillBtn {
    flex: 1 1 0;
    min-width: 0;
    background: #23233a;
    border: 1px solid #4c1d95;
    color: #ddd;
    padding: 5px 4px;
    border-radius: 7px;
    font-size: 0.64rem;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .skillBtn:disabled { opacity: 0.35; }
  .skillBtn.selected { background: #4c1d95; border-color: #a78bfa; }
  .skillBtn.highlighted:not(.selected) { border-color: #7dd3fc; }
  .skillBtn.infoOnly { border-style: dashed; }
  .skillBtn.infoOnly.highlighted { background: #1e2a38; }

  #detailRow { display: flex; flex-direction: row; gap: 4px; height: 38px; }
  #skillDetail {
    flex: 2 1 0;
    min-width: 0;
    background: #1a1a26;
    border: 1px solid #2f2f45;
    border-radius: 7px;
    padding: 3px 8px;
    font-size: 0.58rem;
    line-height: 1.2;
    color: #ccc;
    overflow-y: auto;
  }
  #skillDetail .detailName { color: #a78bfa; font-weight: 600; margin-right: 4px; }
  #skillDetail .detailHint { color: #7dd3fc; display: block; }
  #miniLog {
    flex: 1 1 0;
    min-width: 0;
    background: #0f0f16;
    border: 1px solid #2f2f45;
    border-radius: 7px;
    padding: 3px 6px;
    font-size: 0.5rem;
    line-height: 1.2;
    color: #999;
    overflow-y: auto;
  }
  #miniLog div { margin-bottom: 0; }

  /* ---------------- OVERLAYS ---------------- */
  .overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.9);
    z-index: 25;
    flex-direction: column;
    padding: 16px;
    overflow-y: auto;
  }
  .overlay.show { display: flex; }
  .overlayClose {
    align-self: flex-end;
    background: #23233a;
    border: 1px solid #4c1d95;
    color: #ddd;
    padding: 6px 14px;
    border-radius: 8px;
    margin-bottom: 10px;
    font-size: 0.85rem;
  }
  #logOverlay #logFull div { margin-bottom: 4px; font-size: 0.8rem; }
  .logSys { color: #7dd3fc; }
  .logDmg { color: #fca5a5; }
  .logHeal { color: #86efac; }
  .logBuff { color: #fde68a; }
  .logBoss { color: #f472b6; }

  #resultOverlay {
    align-items: center; justify-content: center;
  }
  #resultOverlay h2 { font-size: 1.6rem; text-align: center; }
</style>
</head>
<body>

<div id="rotateHint">
  <div class="spin">🔄</div>
  <div>Rotate your phone sideways to battle.</div>
</div>

<div id="startScreen">
  <h1>MACHINEBORN</h1>
  <div style="color:#999;">Collect tools. Understand rules. Build machines. Break encounters.</div>
  <button id="resumeBtn" style="display:none;">RESUME BATTLE</button>
  <button id="startBossBtn" data-encounter="boss">BOSS ENCOUNTER (5v5)</button>
  <button id="startWaveBtn" data-encounter="wave">WAVE ENCOUNTER (4v4 x3)</button>
</div>

<div id="teamSelectScreen">
  <h1 id="teamSelectTitle">CHOOSE YOUR TEAM</h1>
  <div id="teamSelectCounter">Selected 0 / 0</div>
  <div id="teamSelectGrid"></div>
  <div id="teamSelectActions">
    <button id="teamSelectBackBtn" class="overlayBtn">BACK</button>
    <button id="teamSelectBeginBtn" class="overlayBtn">BEGIN BATTLE</button>
  </div>
</div>

<div id="battle">
  <div class="unitZone" id="enemyList"></div>
  <div class="unitZone" id="teamList"></div>

  <div id="actionsWrap">
    <div id="skillRow"></div>
    <div id="detailRow">
      <div id="skillDetail"></div>
      <div id="miniLog"></div>
    </div>
  </div>
</div>

<div class="overlay" id="logOverlay">
  <button class="overlayClose" data-close="logOverlay">Close</button>
  <div id="logFull"></div>
</div>

<div class="overlay" id="resultOverlay">
  <h2 id="resultText"></h2>
  <button class="overlayBtn" id="restartBtn" style="align-self:center;">RESTART</button>
</div>

<script>
(function () {
  'use strict';

  // ---------------------------------------------------------------
  // CONFIG
  // ---------------------------------------------------------------
  var MAX_EXTRA_TURN_CHAIN = 2; // revisit: prototype cap on chained extra turns
  var TICK = 1; // turn-meter granularity per simulation tick
  var STACKING_DEBUFF_TYPES = ['Poison']; // debuffs that pile up as independent instances instead of refreshing

  // ---------------------------------------------------------------
  // EVENT BUS  (ACTION -> EVENT -> STATE CHANGE -> TRIGGERS -> ...)
  // ---------------------------------------------------------------
  var listeners = {};
  function on(eventName, fn) {
    (listeners[eventName] = listeners[eventName] || []).push(fn);
  }
  function emit(eventName, payload) {
    var fns = listeners[eventName];
    if (!fns) return;
    fns.slice().forEach(function (fn) { fn(payload); });
  }

  // ---------------------------------------------------------------
  // UNIT FACTORY
  // ---------------------------------------------------------------
  function makeUnit(base, isEnemy) {
    return Object.assign({}, base, {
      maxHp: base.hp,
      hp: base.hp,
      tm: 0,
      isEnemy: !!isEnemy,
      buffs: [],
      debuffs: [],
      cooldowns: {},
      alive: true
    });
  }

  // ---------------------------------------------------------------
  // CHAMPION DEFINITIONS
  // Kit shape: Basic (light built-in condition) + Active 1 + Active 2
  // + Passive (always-on conditional trigger) + Signature (permanent
  // stacking stat shift for the rest of the battle).
  // ---------------------------------------------------------------
  var CHAMPIONS = [
    {
      id: 'vara', name: 'Vara', role: 'Guardian',
      hp: 145, atk: 55, def: 90, spd: 95, critChance: 15, critDamage: 150, acc: 0, res: 40,
      passive: 'Aegis Instinct — at the start of Vara\'s turn, the lowest-HP% living ally gains a Shield worth 15% of their max HP.',
      signature: 'Whenever an ally below 50% HP is hit, Vara permanently gains Defense.',
      basic: {
        name: 'Strike', desc: 'Single-target hit. If Vara is below 70% HP, she also gains Defense Up for 1 turn.',
        coeff: 1.0, aoe: false, targetType: 'enemy',
        onResolved: function (self) {
          if (self.hp / self.maxHp < 0.7) {
            applyBuff(self, 'Defense Up', 30, 1, {});
            logLine('logBuff', self.name + ' grits through the pain — Defense Up.');
          }
        }
      },
      active1: {
        name: "Guardian's Stand", cd: 3, targetType: 'ally',
        desc: 'Shields the chosen ally for 30% of their max HP and grants them Resistance Up, hardens Vara\'s own Defense, and Provokes so enemies attack her instead.',
        coeff: 0, aoe: false,
        effect: function (self, target, ctx) {
          applyBuff(target, 'Shield', 30, 2, ctx);
          applyBuff(target, 'Resistance Up', 30, 2, ctx);
          applyBuff(self, 'Defense Up', 30, 2, ctx);
          applyDebuff(self, 'Provoke', 0, 2, self);
          logLine('logBuff', self.name + ' shields ' + target.name + ' and steps in to draw every hit.');
        }
      },
      active2: {
        name: 'Bulwark Slam', cd: 4, targetType: 'enemy',
        desc: 'Heavy single-target hit. If Vara currently has an active Shield, she cleanses one debuff from herself afterward.',
        coeff: 1.1, aoe: false,
        onResolved: function (self) {
          if (self.buffs.some(function (b) { return b.type === 'Shield'; }) && self.debuffs.length) {
            var idx = Math.floor(Math.random() * self.debuffs.length);
            var removed = self.debuffs.splice(idx, 1)[0];
            logLine('logBuff', self.name + ' cleanses their own ' + removed.type + '.');
          }
        }
      }
    },
    {
      id: 'mire', name: 'Mire', role: 'Plaguebearer',
      hp: 120, atk: 65, def: 60, spd: 100, critChance: 15, critDamage: 150, acc: 20, res: 20,
      passive: 'Plague Detonation — at the start of Mire\'s turn, any enemy with 3+ Poison stacks has all of them extended by 1 turn, then takes bonus damage (2% max HP per stack).',
      signature: 'Applying a Poison permanently increases Mire\'s Speed by 1.',
      basic: {
        name: 'Toxic Strike', desc: 'Single-target hit that seeds Poison (60% chance, 80% if already poisoned).',
        coeff: 0.8, aoe: false, targetType: 'enemy',
        applyDebuff: { type: 'Poison', chance: 60, dynamicChance: function (target) { return countDebuffStacks(target, 'Poison') > 0 ? 80 : 60; } }
      },
      active1: {
        name: 'Plague Cloud', cd: 3, targetType: 'enemy',
        desc: 'AoE hit with a strong chance (75%) to seed Poison on every enemy.',
        coeff: 0.5, aoe: true, applyDebuff: { type: 'Poison', chance: 75 }
      },
      active2: {
        name: 'Wither', cd: 3, targetType: 'enemy',
        desc: 'Single-target hit, chance to apply Defense Down, and always seeds one guaranteed extra Poison stack.',
        coeff: 0.6, aoe: false, applyDebuff: { type: 'Defense Down', chance: 50 },
        onResolved: function (self, targets) {
          targets.forEach(function (t) {
            if (t.alive) applyDebuff(t, 'Poison', 30, 2, self);
          });
        }
      }
    },
    {
      id: 'kestrel', name: 'Kestrel', role: 'Controller',
      hp: 110, atk: 60, def: 55, spd: 105, critChance: 15, critDamage: 150, acc: 15, res: 25,
      passive: 'Windcall — whenever Kestrel uses her Basic Attack, any ally with 3+ active buffs joins in, each dealing 30% of their Attack as bonus damage to her target(s).',
      signature: 'Every basic attack this Champion performs permanently increases her Attack by 5.',
      basic: {
        name: 'Gust', desc: 'AoE hit. Deals 15% more damage to targets that currently have an active buff.',
        coeff: 0.65, aoe: true, targetType: 'enemy',
        conditionalMult: function (target) { return target.buffs.length > 0 ? 1.15 : 1; }
      },
      active1: {
        name: 'Cyclone', cd: 4, targetType: 'enemy',
        desc: 'AoE hit with a chance to Stun (40%) and a chance to apply Speed Down (60%) to every enemy.',
        coeff: 0.4, aoe: true,
        applyDebuff: { type: 'Stun', chance: 40 }, applyDebuff2: { type: 'Speed Down', chance: 60 }
      },
      active2: {
        name: 'Static Field', cd: 4, targetType: 'enemy',
        desc: 'Light AoE hit with a strong chance (70%) to Block Buffs and a chance (50%) to apply Accuracy Down to every enemy.',
        coeff: 0.3, aoe: true,
        applyDebuff: { type: 'Block Buffs', chance: 70 },
        applyDebuff2: { type: 'Accuracy Down', chance: 50 }
      }
    },
    {
      id: 'rook', name: 'Rook', role: 'Executioner',
      hp: 130, atk: 80, def: 65, spd: 90, critChance: 20, critDamage: 160, acc: 10, res: 15,
      passive: "Executioner's Eye — if Rook's target is below 30% HP, his attacks always critically hit.",
      signature: 'Attacking an enemy below 50% HP permanently increases Rook\'s Crit Damage.',
      basic: {
        name: 'Cleave', desc: 'Single-target hit. Deals 20% more damage to targets above 80% HP.',
        coeff: 1.0, aoe: false, targetType: 'enemy',
        conditionalMult: function (target) { return (target.hp / target.maxHp) > 0.8 ? 1.2 : 1; }
      },
      active1: {
        name: 'Execute', cd: 3, targetType: 'enemy',
        desc: 'Single-target hit, dealing far more damage (2.2x instead of 1.2x coefficient) if the target is below 50% HP. Rook gains Accuracy Up afterward.',
        coeff: 1.2, executeCoeff: 2.2, aoe: false,
        onResolved: function (self) {
          applyBuff(self, 'Accuracy Up', 30, 2, {});
          logLine('logBuff', self.name + ' finds his rhythm — Accuracy Up.');
        }
      },
      active2: {
        name: 'Culling Blow', cd: 4, targetType: 'enemy',
        desc: 'Single-target true-damage hit — ignores Defense entirely. A kill grants Rook an immediate extra turn.',
        coeff: 1.0, aoe: false, trueDamage: true, extraTurnOnKill: true
      }
    },
    {
      id: 'nyx', name: 'Nyx', role: 'Contagionist',
      hp: 115, atk: 62, def: 55, spd: 98, critChance: 15, critDamage: 150, acc: 15, res: 20,
      passive: 'Spreading Rot — whenever an enemy dies afflicted with 2+ debuffs, Nyx transfers one of them to a random remaining enemy.',
      signature: 'Every debuff placed on Nyx permanently increases her Speed by 1.',
      basic: {
        name: 'Shadow Touch', desc: 'Single-target hit. Deals 15% more damage to targets with 2 or more debuffs.',
        coeff: 0.8, aoe: false, targetType: 'enemy',
        conditionalMult: function (target) { return target.debuffs.length >= 2 ? 1.15 : 1; }
      },
      active1: {
        name: 'Contagion', cd: 4, targetType: 'enemy',
        desc: 'Rips every debuff off your lowest-HP% ally and hurls all of them onto the chosen enemy.',
        coeff: 0, aoe: false,
        effect: function (self, target, ctx) {
          var ally = lowestHpAlly(ctx.team);
          if (ally && ally.debuffs.length) {
            var moved = ally.debuffs.splice(0, ally.debuffs.length);
            moved.forEach(function (d) {
              target.debuffs.push(d);
              emit('debuffApplied', { unit: target, debuff: d, source: self });
            });
            logLine('logBuff', self.name + ' rips ' + moved.length + ' debuff(s) from ' + ally.name + ' and hurls them onto ' + target.name + '.');
          } else {
            logLine('logSys', self.name + ' finds nothing to transfer.');
          }
        }
      },
      active2: {
        name: 'Curse Weave', cd: 3, targetType: 'enemy',
        desc: 'No damage. Strong chance (70% each) to apply Attack Down and Defense Down, plus a chance (60%) to apply Resistance Down.',
        coeff: 0, aoe: false,
        effect: function (self, target) {
          var hitAtk = accuracyRoll(self, target, 70);
          var hitDef = accuracyRoll(self, target, 70);
          var hitRes = accuracyRoll(self, target, 60);
          if (hitAtk) applyDebuff(target, 'Attack Down', 30, 2, self);
          if (hitDef) applyDebuff(target, 'Defense Down', 30, 2, self);
          if (hitRes) applyDebuff(target, 'Resistance Down', 30, 2, self);
          logLine('logBuff', self.name + ' weaves curses onto ' + target.name + ((hitAtk || hitDef || hitRes) ? '.' : ', but none take hold.'));
        }
      }
    },
    {
      id: 'wren', name: 'Wren', role: 'Sentinel',
      hp: 125, atk: 50, def: 70, spd: 97, critChance: 15, critDamage: 150, acc: 10, res: 35,
      passive: "Guardian's Echo — whenever an ally with Counter is attacked, Wren gains a Shield worth 10% of her max HP.",
      signature: "Whenever Wren extends an ally's buffs, she permanently gains Resistance.",
      basic: {
        name: 'Ward Strike', desc: 'Single-target hit. If an ally is below 50% HP, they also gain Regeneration for 1 turn.',
        coeff: 0.75, aoe: false, targetType: 'enemy',
        onResolved: function (self) {
          var ally = lowestHpAlly(aliveTeam());
          if (ally && ally.hp / ally.maxHp < 0.5) {
            applyBuff(ally, 'Regeneration', 0, 1, {});
            logLine('logHeal', self.name + ' tends to ' + ally.name + ' — Regeneration.');
          }
        }
      },
      active1: {
        name: 'Rallying Ward', cd: 3, targetType: 'ally',
        desc: 'Grants the chosen ally Regeneration, Counter, and a Block Debuffs ward for 2 turns.',
        coeff: 0, aoe: false,
        effect: function (self, target) {
          applyBuff(target, 'Regeneration', 0, 2, {});
          applyBuff(target, 'Counter', 25, 2, {});
          applyBuff(target, 'Block Debuffs', 0, 2, {});
          logLine('logBuff', self.name + ' wards ' + target.name + ' — Regeneration, Counter, and a debuff ward.');
        }
      },
      active2: {
        name: 'Prolong', cd: 4, targetType: 'ally',
        desc: 'Extends every buff currently on the chosen ally by 1 turn.',
        coeff: 0, aoe: false,
        effect: function (self, target) {
          if (!target.buffs.length) { logLine('logSys', target.name + ' has no buffs to extend.'); return; }
          target.buffs.forEach(function (b) { b.duration += 1; });
          logLine('logBuff', self.name + ' extends ' + target.buffs.length + ' buff(s) on ' + target.name + '.');
          emit('buffsExtended', { unit: target, source: self });
        }
      }
    }
  ];

  // ---------------------------------------------------------------
  // ENEMY DEFINITIONS
  // ---------------------------------------------------------------
  var BOSS_WAVE = [
    { id: 'grunt1', name: 'Grunt', hp: 100, atk: 50, def: 40, spd: 85, critChance: 10, critDamage: 150, acc: 0, res: 10,
      basic: { name: 'Slash', coeff: 0.9, aoe: false } },
    { id: 'warden', name: 'Warden', hp: 160, atk: 45, def: 100, spd: 75, critChance: 5, critDamage: 150, acc: 10, res: 20,
      basic: { name: 'Shield Bash', coeff: 0.7, aoe: false, applyDebuff: { type: 'Defense Down', chance: 50 } } },
    { id: 'leech', name: 'Leech', hp: 90, atk: 55, def: 45, spd: 95, critChance: 10, critDamage: 150, acc: 15, res: 10,
      basic: { name: 'Drain Bite', coeff: 0.6, aoe: false, drainPct: 40 } },
    { id: 'hollowking', name: 'Hollow King', hp: 900, atk: 70, def: 90, spd: 88, critChance: 15, critDamage: 175, acc: 25, res: 35,
      isBoss: true,
      basic: { name: 'Dread Strike', coeff: 1.0, aoe: false } },
    { id: 'grunt2', name: 'Grunt', hp: 100, atk: 50, def: 40, spd: 82, critChance: 10, critDamage: 150, acc: 0, res: 10,
      basic: { name: 'Slash', coeff: 0.9, aoe: false } }
  ];

  // 4v4, three waves - tests AoE clear speed, a self-buffing enemy
  // (Kestrel's basic punishes buffed targets), and Bleed (previously
  // never actually applied by anything) in that order.
  var WAVE_1 = [
    { id: 'skitter1', name: 'Skitterling', hp: 70, atk: 40, def: 20, spd: 110, critChance: 10, critDamage: 150, acc: 5, res: 5,
      basic: { name: 'Nip', coeff: 0.8, aoe: false } },

  // ---------------------------------------------------------------
  // ENCOUNTERS
  // Squad size follows content type: 5v5 for boss content, 4v4 for
  // general wave content (per design direction - not a change to the
  // combat engine's default, just a per-encounter squad size).
  // ---------------------------------------------------------------
  var ENCOUNTERS = {
    boss: { label: 'Boss Encounter', teamIds: ['vara', 'mire', 'kestrel', 'rook', 'nyx'], waves: [BOSS_WAVE] },
    wave: { label: 'Wave Encounter', teamIds: ['mire', 'kestrel', 'rook', 'nyx'], waves: [WAVE_1, WAVE_2, WAVE_3] }
  };

  // ---------------------------------------------------------------
  // BATTLE STATE
  // ---------------------------------------------------------------
  var team, enemies, battleOver, pendingAction, extraTurnChain;
  var highlightedSlot = 'basic'; // which of basic/active1/active2/passive/signature is previewed in the detail panel
  var currentEncounterId, currentWaves, currentTeamIds, waveIndex;

  function spawnWave(templates) {
    enemies = templates.map(function (e) { return makeUnit(e, true); });
    enemies.forEach(function (e) { if (e.isBoss) { e.bossTurnCount = 0; e.fury = 0; } });
  }

  function newBattle(encounterId, teamIds) {
    var config = ENCOUNTERS[encounterId];
    currentEncounterId = encounterId;
    currentWaves = config.waves;
    currentTeamIds = teamIds || config.teamIds;
    waveIndex = 0;
    team = currentTeamIds.map(function (id) { return makeUnit(CHAMPIONS.find(function (c) { return c.id === id; }), false); });
    spawnWave(currentWaves[waveIndex]);
    battleOver = false;
    pendingAction = null;
    extraTurnChain = 0;
    clearLog();
    logLine('logSys', 'A new encounter begins.');
    wireEventHooks();
    render();
  }

  function allUnits() { return team.concat(enemies); }
  function aliveTeam() { return team.filter(function (u) { return u.alive; }); }
  function aliveEnemies() { return enemies.filter(function (u) { return u.alive; }); }
  function lowestHpAlly(list) {
    var alive = list.filter(function (u) { return u.alive; });
    if (!alive.length) return null;
    return alive.reduce(function (a, b) { return (b.hp / b.maxHp) < (a.hp / a.maxHp) ? b : a; });
  }
  function countDebuffStacks(unit, type) {
    return unit.debuffs.filter(function (d) { return d.type === type; }).length;
  }
  function findChampion(id) {
    return team.find(function (u) { return u.id === id && u.alive; });
  }

  // ---------------------------------------------------------------
  // SAVE / RESUME (localStorage) — a battle in progress survives a
  // reload, backgrounding, or closing the tab. Only mutable runtime
  // state is persisted; ability definitions (with their functions)
  // stay in CHAMPIONS/ENCOUNTERS and are never serialized.
  // ---------------------------------------------------------------
  var SAVE_KEY = 'machineborn_save_v1';

  function serializeUnit(u) {
    return {
      id: u.id, hp: u.hp, maxHp: u.maxHp, tm: u.tm,
      atk: u.atk, def: u.def, spd: u.spd,
      critChance: u.critChance, critDamage: u.critDamage, acc: u.acc, res: u.res,
      alive: u.alive, buffs: u.buffs, debuffs: u.debuffs, cooldowns: u.cooldowns,
      bossTurnCount: u.bossTurnCount, fury: u.fury
    };
  }

  function saveBattle() {
    if (!team || battleOver) return;
    var logLines = Array.prototype.map.call(document.getElementById('logFull').children, function (div) {
      return { cls: div.className, text: div.textContent };
    });
    var data = {
      version: 3,
      encounterId: currentEncounterId,
      teamIds: currentTeamIds,
      waveIndex: waveIndex,
      team: team.map(serializeUnit),
      enemies: enemies.map(serializeUnit),
      pendingActorId: pendingAction ? pendingAction.actor.id : null,
      pendingChosen: pendingAction ? pendingAction.chosen : null,
      highlightedSlot: highlightedSlot,
      log: logLines
    };
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(data)); } catch (e) { /* private mode / quota - resume just won't be available */ }
  }

  function loadSavedBattle() {
    try {
      var raw = localStorage.getItem(SAVE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }

  function clearSave() {
    try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* ignore */ }
  }

  function applySavedUnitState(units, savedList) {
    savedList.forEach(function (saved) {
      var unit = units.find(function (u) { return u.id === saved.id; });
      if (!unit) return;
      Object.assign(unit, saved);
    });
  }

  function resumeBattle(saved) {
    var config = ENCOUNTERS[saved.encounterId];
    if (!config) { clearSave(); return; } // save from an encounter that no longer exists
    currentEncounterId = saved.encounterId;
    currentWaves = config.waves;
    currentTeamIds = saved.teamIds || config.teamIds;
    waveIndex = saved.waveIndex || 0;
    team = currentTeamIds.map(function (id) { return makeUnit(CHAMPIONS.find(function (c) { return c.id === id; }), false); });
    spawnWave(currentWaves[waveIndex]);
    applySavedUnitState(team, saved.team);
    applySavedUnitState(enemies, saved.enemies);
    battleOver = false;
    extraTurnChain = 0;
    highlightedSlot = saved.highlightedSlot || 'basic';
    clearLog();
    (saved.log || []).forEach(function (entry) { logLine(entry.cls, entry.text); });
    logLine('logSys', 'Battle resumed.');
    wireEventHooks();

    document.getElementById('teamSelectScreen').style.display = 'none';
    document.getElementById('startScreen').style.display = 'none';
    document.body.classList.add('battleActive');
    document.getElementById('battle').classList.add('active');

    if (saved.pendingActorId) {
      var actor = team.find(function (u) { return u.id === saved.pendingActorId && u.alive; });
      pendingAction = actor ? { actor: actor, chosen: saved.pendingChosen || 'basic' } : null;
    } else {
      pendingAction = null;
    }

    if (pendingAction) {
      render();
    } else {
      render();
      runUntilPlayerInput();
    }
  }

  // ---------------------------------------------------------------
  // SIGNATURES (permanent stacking stat shifts) + PASSIVES
  // (always-on conditional triggers), all event-driven.
  // ---------------------------------------------------------------
  function wireEventHooks() {
    listeners = {}; // reset bus per battle

    // --- SIGNATURES ---

    // Vara: ally below 50% HP is hit -> permanent Defense.
    on('damageTaken', function (p) {
      var vara = findChampion('vara');
      if (!vara) return;
      if (!p.unit.isEnemy && p.unit !== vara && (p.unit.hp / p.unit.maxHp) < 0.5) {
        vara.def += 4;
        logLine('logBuff', 'Vara (Signature): ' + p.unit.name + ' is in danger — Defense +4 (now ' + vara.def + ').');
      }
    });

    // Mire: applying Poison -> permanent Speed +1.
    on('debuffApplied', function (p) {
      if (p.source && p.source.id === 'mire' && p.debuff.type === 'Poison') {
        p.source.spd += 1;
        logLine('logBuff', 'Mire (Signature): Poison spreads, Speed +1 (now ' + p.source.spd + ').');
      }
      // Nyx: any debuff placed on her -> permanent Speed +1.
      if (p.unit && p.unit.id === 'nyx') {
        p.unit.spd += 1;
        logLine('logBuff', 'Nyx (Signature): afflicted, Speed +1 (now ' + p.unit.spd + ').');
      }
    });

    // Kestrel: every basic attack -> permanent Attack +5.
    on('basicAttackUsed', function (p) {
      if (p.unit.id === 'kestrel') {
        p.unit.atk += 5;
        logLine('logBuff', 'Kestrel (Signature): Attack +5 (now ' + p.unit.atk + ').');
      }
    });

    // Rook: attacking a sub-50% HP enemy -> permanent Crit Damage.
    on('attackResolved', function (p) {
      if (p.attacker.id === 'rook' && (p.target.hp / p.target.maxHp) < 0.5) {
        p.attacker.critDamage += 10;
        logLine('logBuff', 'Rook (Signature): exploits the weak, Crit Damage +10% (now ' + p.attacker.critDamage + '%).');
      }
    });

    // Wren: extending an ally's buffs -> permanent Resistance.
    on('buffsExtended', function (p) {
      if (p.source && p.source.id === 'wren') {
        p.source.res += 4;
        logLine('logBuff', 'Wren (Signature): extension takes hold, Resistance +4 (now ' + p.source.res + ').');
      }
    });

    // --- PASSIVES ---

    // Vara — Aegis Instinct: start of her turn, shield the lowest-HP% ally.
    on('turnStart', function (p) {
      if (p.unit.id !== 'vara') return;
      var ally = lowestHpAlly(aliveTeam());
      if (ally) {
        applyBuff(ally, 'Shield', 15, 2, {});
        logLine('logBuff', 'Vara (Passive): shields ' + ally.name + '.');
      }
    });

    // Mire — Plague Detonation: start of her turn, detonate heavily-poisoned enemies.
    on('turnStart', function (p) {
      if (p.unit.id !== 'mire') return;
      aliveEnemies().forEach(function (enemy) {
        var stacks = countDebuffStacks(enemy, 'Poison');
        if (stacks >= 3) {
          enemy.debuffs.forEach(function (d) { if (d.type === 'Poison') d.duration += 1; });
          var dmg = Math.round(enemy.maxHp * 0.02 * stacks);
          logLine('logBuff', 'Mire (Passive): detonates ' + stacks + ' Poison stacks on ' + enemy.name + '.');
          dealDamage(enemy, dmg, 'Plague Detonation');
        }
      });
    });

    // Kestrel — Windcall: on her basic attack, buffed allies join in.
    on('basicAttackUsed', function (p) {
      if (p.unit.id !== 'kestrel') return;
      aliveTeam().forEach(function (ally) {
        if (ally === p.unit || ally.buffs.length < 3) return;
        var bonus = Math.round(ally.atk * 0.3);
        logLine('logBuff', 'Kestrel (Passive): ' + ally.name + ' joins the attack.');
        p.targets.forEach(function (t) {
          if (t.alive) dealDamage(t, Math.max(1, Math.round(bonus * defenseMultiplier(effectiveDef(t)))), ally.name + ' (assist)');
        });
      });
    });

    // Nyx — Spreading Rot: enemy dies with 2+ debuffs, spread one to a survivor.
    on('death', function (p) {
      var nyx = findChampion('nyx');
      if (!nyx || !p.unit.isEnemy || p.unit.debuffs.length < 2) return;
      var survivors = aliveEnemies();
      if (!survivors.length) return;
      var recipient = survivors[Math.floor(Math.random() * survivors.length)];
      var debuff = p.unit.debuffs[Math.floor(Math.random() * p.unit.debuffs.length)];
      applyDebuff(recipient, debuff.type, debuff.value, debuff.duration, nyx);
      logLine('logBuff', 'Nyx (Passive): ' + debuff.type + ' spreads from the dying ' + p.unit.name + ' to ' + recipient.name + '.');
    });

    // Wren — Guardian's Echo: an ally with Counter is attacked, Wren gains a Shield.
    on('damageTaken', function (p) {
      var wren = findChampion('wren');
      if (!wren || p.unit.isEnemy) return;
      if (p.unit.buffs.some(function (b) { return b.type === 'Counter'; })) {
        applyBuff(wren, 'Shield', 10, 2, {});
        logLine('logBuff', "Wren (Passive): " + p.unit.name + "'s counter-stance triggers a Shield.");
      }
    });
  }

  // ---------------------------------------------------------------
  // BUFF / DEBUFF HELPERS
  // ---------------------------------------------------------------
  function applyBuff(unit, type, value, duration, ctx) {
    if (unit.debuffs.some(function (d) { return d.type === 'Block Buffs'; })) {
      logLine('logSys', unit.name + "'s buffs are blocked.");
      return false;
    }
    var existing = unit.buffs.find(function (b) { return b.type === type; });
    if (type === 'Shield') {
      var pool = Math.round(unit.maxHp * (value / 100));
      if (existing) { existing.pool += pool; existing.duration = Math.max(existing.duration, duration); }
      else { unit.buffs.push({ type: type, value: value, duration: duration, pool: pool }); }
    } else if (existing) {
      existing.duration = Math.max(existing.duration, duration);
    } else {
      unit.buffs.push({ type: type, value: value, duration: duration });
    }
    emit('buffApplied', { unit: unit, buff: { type: type, value: value }, source: (ctx && ctx.source) || unit });
    return true;
  }

  function applyDebuff(unit, type, value, duration, source) {
    if (unit.buffs.some(function (b) { return b.type === 'Immunity' || b.type === 'Block Debuffs'; })) {
      logLine('logSys', unit.name + ' resists the effect.');
      return false;
    }
    if (STACKING_DEBUFF_TYPES.indexOf(type) !== -1) {
      unit.debuffs.push({ type: type, value: value, duration: duration });
    } else {
      var existing = unit.debuffs.find(function (d) { return d.type === type; });
      if (existing) { existing.duration = Math.max(existing.duration, duration); }
      else { unit.debuffs.push({ type: type, value: value, duration: duration }); }
    }
    emit('debuffApplied', { unit: unit, debuff: { type: type, value: value }, source: source });
    return true;
  }

  function statMult(unit, upName, downName) {
    var mult = 1;
    unit.buffs.forEach(function (b) { if (b.type === upName) mult += 0.30; });
    unit.debuffs.forEach(function (d) { if (d.type === downName) mult -= 0.30; });
    return Math.max(0.1, mult);
  }

  function effectiveAtk(unit) { return unit.atk * statMult(unit, 'Attack Up', 'Attack Down'); }
  function effectiveDef(unit) { return unit.def * statMult(unit, 'Defense Up', 'Defense Down'); }
  function effectiveSpd(unit) { return unit.spd * statMult(unit, 'Speed Up', 'Speed Down'); }
  function effectiveAcc(unit) { return unit.acc * statMult(unit, 'Accuracy Up', 'Accuracy Down'); }
  function effectiveRes(unit) { return unit.res * statMult(unit, 'Resistance Up', 'Resistance Down'); }

  // ---------------------------------------------------------------
  // DAMAGE / ACCURACY MATH
  // ---------------------------------------------------------------
  function defenseMultiplier(def) { return 1000 / (1000 + def); }

  function rollCrit(unit) { return Math.random() * 100 < unit.critChance; }

  function computeDamage(attacker, target, coeff, trueDamage) {
    var raw = coeff * effectiveAtk(attacker);
    var mitigated = trueDamage ? raw : raw * defenseMultiplier(effectiveDef(target));
    // Rook passive — Executioner's Eye: always crits a target below 30% HP.
    var guaranteedCrit = attacker.id === 'rook' && (target.hp / target.maxHp) < 0.3;
    var crit = guaranteedCrit || rollCrit(attacker);
    if (crit) mitigated *= (attacker.critDamage / 100);
    return { amount: Math.max(1, Math.round(mitigated)), crit: crit };
  }

  function accuracyRoll(attacker, target, baseChance) {
    var acc = effectiveAcc(attacker), res = effectiveRes(target);
    var edge = (acc - res) / 200; // acc-vs-res advantage, roughly -0.5..0.5
    var finalChance = Math.min(100, Math.max(5, baseChance + edge * 30));
    return Math.random() * 100 < finalChance;
  }

  // ---------------------------------------------------------------
  // DAMAGE APPLICATION
  // ---------------------------------------------------------------
  function dealDamage(target, amount, sourceLabel) {
    var shield = target.buffs.find(function (b) { return b.type === 'Shield'; });
    if (shield && shield.pool > 0) {
      var absorbed = Math.min(shield.pool, amount);
      shield.pool -= absorbed;
      amount -= absorbed;
      logLine('logBuff', target.name + "'s shield absorbs " + absorbed + ' damage' + (shield.pool <= 0 ? ' and breaks' : ' (' + shield.pool + ' left)') + '.');
      if (shield.pool <= 0) target.buffs = target.buffs.filter(function (b) { return b !== shield; });
      if (amount <= 0) return;
    }
    target.hp = Math.max(0, target.hp - amount);
    emit('damageTaken', { unit: target, amount: amount });
    logLine('logDmg', target.name + ' takes ' + amount + ' damage' + (sourceLabel ? ' from ' + sourceLabel : '') + '. (' + target.hp + '/' + target.maxHp + ')');
    if (target.hp <= 0) killUnit(target);
  }

  function killUnit(unit) {
    if (!unit.alive) return;
    unit.alive = false;
    unit.tm = 0;
    logLine('logSys', unit.name + ' has fallen.');
    emit('death', { unit: unit });
  }

  function tryCounter(defender, attacker) {
    if (!defender.alive || !attacker.alive) return;
    var counterBuff = defender.buffs.find(function (b) { return b.type === 'Counter'; });
    if (!counterBuff) return;
    if (Math.random() * 100 < 25) {
      var dmg = computeDamage(defender, attacker, 0.6);
      logLine('logDmg', defender.name + ' counterattacks!');
      dealDamage(attacker, dmg.amount, defender.name + "'s counter");
    }
  }

  // ---------------------------------------------------------------
  // START-OF-TURN / END-OF-TURN PROCESSING
  // ---------------------------------------------------------------
  function startOfTurnEffects(unit) {
    if (!unit.alive) return;
    var hasRegen = unit.buffs.some(function (b) { return b.type === 'Regeneration'; });
    if (hasRegen) {
      var heal = Math.round(unit.maxHp * 0.05);
      unit.hp = Math.min(unit.maxHp, unit.hp + heal);
      logLine('logHeal', unit.name + ' regenerates ' + heal + ' HP.');
    }
    var poisonStacks = countDebuffStacks(unit, 'Poison');
    if (poisonStacks > 0 && unit.alive) {
      var poisonDmg = Math.round(unit.maxHp * 0.05 * poisonStacks);
      unit.hp = Math.max(0, unit.hp - poisonDmg);
      logLine('logDmg', unit.name + ' suffers ' + poisonDmg + ' Poison damage (' + poisonStacks + ' stacks). (' + unit.hp + '/' + unit.maxHp + ')');
      if (unit.hp <= 0) killUnit(unit);
    }
    var burn = unit.debuffs.find(function (d) { return d.type === 'Burn'; });
    if (burn && unit.alive) {
      var burnDmg = Math.round(unit.maxHp * 0.03);
      unit.hp = Math.max(0, unit.hp - burnDmg);
      logLine('logDmg', unit.name + ' suffers ' + burnDmg + ' Burn damage. (' + unit.hp + '/' + unit.maxHp + ')');
      if (unit.hp <= 0) killUnit(unit);
    }
  }

  function processDurations(unit) {
    unit.buffs = unit.buffs.filter(function (b) { b.duration -= 1; return b.duration > 0; });
    unit.debuffs = unit.debuffs.filter(function (d) { d.duration -= 1; return d.duration > 0; });
  }

  // Hollow King: every 3rd own turn, consume most recently applied debuff on itself, gain permanent Fury.
  function hollowKingMechanic(boss) {
    if (!boss.isBoss || !boss.alive) return;
    boss.bossTurnCount += 1;
    if (boss.bossTurnCount % 3 === 0) {
      if (boss.debuffs.length) {
        var consumed = boss.debuffs.pop(); // most recently applied = end of array
        boss.fury += 1;
        boss.atk = Math.round(boss.atk * 1.15);
        logLine('logBoss', 'Hollow King devours its ' + consumed.type + ' and gains Fury x' + boss.fury + '! (Attack now ' + boss.atk + ')');
      } else {
        logLine('logBoss', 'Hollow King finds no debuff to consume this cycle.');
      }
    }
  }

  // ---------------------------------------------------------------
  // TURN QUEUE (turn meter simulation)
  // ---------------------------------------------------------------
  function advanceToNextActor() {
    while (true) {
      if (checkBattleEnd()) return null;
      allUnits().forEach(function (u) {
        if (u.alive) u.tm += effectiveSpd(u) * TICK * 0.12;
      });
      var ready = allUnits().filter(function (u) { return u.alive && u.tm >= 100; });
      if (ready.length) {
        ready.sort(function (a, b) {
          if (b.tm !== a.tm) return b.tm - a.tm;
          return effectiveSpd(b) - effectiveSpd(a);
        });
        return ready[0];
      }
    }
  }

  function checkBattleEnd() {
    if (battleOver) return true;
    if (aliveTeam().length === 0) { endBattle(false); return true; }
    if (aliveEnemies().length === 0) {
      if (waveIndex < currentWaves.length - 1) {
        waveIndex += 1;
        spawnWave(currentWaves[waveIndex]);
        logLine('logBoss', 'Wave ' + (waveIndex + 1) + ' of ' + currentWaves.length + ' incoming!');
        return false;
      }
      endBattle(true);
      return true;
    }
    return false;
  }

  function endBattle(won) {
    battleOver = true;
    clearSave();
    logLine('logSys', won ? 'VICTORY.' : 'DEFEAT.');
    document.getElementById('resultText').textContent = won ? 'VICTORY' : 'DEFEAT';
    document.getElementById('resultOverlay').classList.add('show');
  }

  // ---------------------------------------------------------------
  // MAIN LOOP DRIVER
  // ---------------------------------------------------------------
  function runUntilPlayerInput() {
    if (checkBattleEnd()) { render(); return; }
    var actor = advanceToNextActor();
    if (!actor) { render(); return; }
    takeTurn(actor, false);
  }

  // isExtra: an immediate bonus turn granted by an interaction (e.g. Rook's
  // Culling Blow on a kill) rather than one earned by ticking turn meter.
  // Extra turns do not consume/refund turn meter, but everything else about
  // a turn still happens - cooldowns keep ticking down, start-of-turn
  // effects still fire - "extra turns do not automatically reset cooldowns."
  function takeTurn(actor, isExtra) {
    if (!isExtra) {
      extraTurnChain = 0;
      actor.tm -= 100;
    }
    Object.keys(actor.cooldowns).forEach(function (k) { if (actor.cooldowns[k] > 0) actor.cooldowns[k] -= 1; });

    startOfTurnEffects(actor);
    if (checkBattleEnd()) { render(); return; }
    emit('turnStart', { unit: actor });
    if (checkBattleEnd()) { render(); return; }

    if (actor.isBoss) hollowKingMechanic(actor);

    var stunned = actor.debuffs.some(function (d) { return d.type === 'Stun'; });
    if (stunned) {
      logLine('logSys', actor.name + ' is stunned and cannot act.');
      finishTurn(actor);
      runUntilPlayerInput();
      return;
    }

    if (actor.isEnemy) {
      enemyAct(actor);
      finishTurn(actor);
      runUntilPlayerInput();
    } else {
      pendingAction = { actor: actor, chosen: 'basic' };
      highlightedSlot = 'basic';
      render();
    }
  }

  function finishTurn(actor) {
    processDurations(actor);
  }

  function grantExtraTurn(actor) {
    if (checkBattleEnd()) { render(); return; }
    if (extraTurnChain >= MAX_EXTRA_TURN_CHAIN) {
      logLine('logSys', actor.name + "'s extra-turn chain caps out.");
      runUntilPlayerInput();
      return;
    }
    extraTurnChain += 1;
    logLine('logBoss', actor.name + ' gains an extra turn! (chain ' + extraTurnChain + '/' + MAX_EXTRA_TURN_CHAIN + ')');
    takeTurn(actor, true);
  }

  // ---------------------------------------------------------------
  // ENEMY AI
  // ---------------------------------------------------------------
  function enemyAct(actor) {
    var target = pickEnemyTarget(actor);
    if (!target) return;
    var ability = actor.basic;
    logLine('logSys', actor.name + ' uses ' + ability.name + ' on ' + target.name + '.');
    performAttack(actor, target, ability, team, false);
  }

  function pickEnemyTarget(actor) {
    var provoked = aliveTeam().filter(function (u) { return u.debuffs.some(function (d) { return d.type === 'Provoke'; }); });
    var pool = provoked.length ? provoked : aliveTeam();
    if (!pool.length) return null;
    return pool[Math.floor(Math.random() * pool.length)];
  }

  // ---------------------------------------------------------------
  // ATTACK / ABILITY RESOLUTION
  // ---------------------------------------------------------------
  function performAttack(attacker, primaryTarget, ability, defenderList, isBasic) {
    var targets = ability.aoe ? defenderList.filter(function (u) { return u.alive; }) : [primaryTarget];
    targets.forEach(function (target) {
      if (!target.alive) return;
      var condMult = ability.conditionalMult ? ability.conditionalMult(target) : 1;
      var dmg = computeDamage(attacker, target, ability.coeff * condMult, ability.trueDamage);
      var wasAlive = target.alive;
      dealDamage(target, dmg.amount, attacker.name + (dmg.crit ? ' (CRIT)' : ''));
      emit('attackResolved', { attacker: attacker, target: target, amount: dmg.amount, crit: dmg.crit });
      if (wasAlive && target.alive) {
        var bleed = target.debuffs.find(function (d) { return d.type === 'Bleed'; });
        if (bleed) {
          var bleedDmg = Math.round(target.maxHp * 0.04);
          dealDamage(target, bleedDmg, 'Bleed');
        }
        tryCounter(target, attacker);
      }
      if (ability.drainPct && target.alive) {
        var healAmt = Math.round(dmg.amount * (ability.drainPct / 100));
        attacker.hp = Math.min(attacker.maxHp, attacker.hp + healAmt);
        logLine('logHeal', attacker.name + ' drains ' + healAmt + ' HP.');
      }
      if (ability.applyDebuff && target.alive) {
        var chance1 = ability.applyDebuff.dynamicChance ? ability.applyDebuff.dynamicChance(target) : ability.applyDebuff.chance;
        if (accuracyRoll(attacker, target, chance1)) {
          applyDebuff(target, ability.applyDebuff.type, 30, 2, attacker);
          logLine('logBuff', target.name + ' is afflicted with ' + ability.applyDebuff.type + '.');
        }
      }
      if (ability.applyDebuff2 && target.alive) {
        var chance2 = ability.applyDebuff2.dynamicChance ? ability.applyDebuff2.dynamicChance(target) : ability.applyDebuff2.chance;
        if (accuracyRoll(attacker, target, chance2)) {
          applyDebuff(target, ability.applyDebuff2.type, 30, 2, attacker);
          logLine('logBuff', target.name + ' is afflicted with ' + ability.applyDebuff2.type + '.');
        }
      }
    });
    if (ability.onResolved) ability.onResolved(attacker, targets);
    if (isBasic) emit('basicAttackUsed', { unit: attacker, targets: targets });
  }

  function useEffectAbility(actor, target, ability, ctx) {
    if (ability.effect) ability.effect(actor, target, ctx);
  }

  // ---------------------------------------------------------------
  // PLAYER ACTION HANDLING
  // kind is 'basic', 'active1', or 'active2' — matching the champion
  // object's own ability keys.
  // ---------------------------------------------------------------
  function playerChooseAbility(kind) {
    if (!pendingAction) return;
    var actor = pendingAction.actor;
    highlightedSlot = kind;
    if (kind !== 'basic' && actor.cooldowns[kind] > 0) { render(); return; }
    if (kind !== 'basic' && actor.debuffs.some(function (d) { return d.type === 'Silence'; })) {
      logLine('logSys', actor.name + ' is silenced.');
      render();
      return;
    }
    pendingAction.chosen = kind;
    render();
  }

  function highlightInfoSlot(slot) {
    highlightedSlot = slot;
    render();
  }

  function playerChooseTarget(target) {
    if (!pendingAction || !pendingAction.chosen) return;
    var actor = pendingAction.actor;
    var kind = pendingAction.chosen;
    var ability = actor[kind];

    if (kind !== 'basic') {
      if (ability.coeff > 0 || ability.executeCoeff) {
        var coeff = ability.executeCoeff && (target.hp / target.maxHp) < 0.5 ? ability.executeCoeff : ability.coeff;
        performAttack(actor, target, Object.assign({}, ability, { coeff: coeff }), enemies, false);
      } else {
        useEffectAbility(actor, target, ability, { team: team, enemies: enemies });
      }
      actor.cooldowns[kind] = ability.cd;
    } else {
      performAttack(actor, target, ability, enemies, true);
    }

    var earnedExtraTurn = kind !== 'basic' && ability.extraTurnOnKill && target.alive === false;

    pendingAction = null;
    finishTurn(actor);
    render();
    setTimeout(function () {
      if (earnedExtraTurn) grantExtraTurn(actor);
      else runUntilPlayerInput();
    }, 250);
  }

  // ---------------------------------------------------------------
  // LOGGING
  // ---------------------------------------------------------------
  function clearLog() {
    document.getElementById('logFull').innerHTML = '';
    document.getElementById('miniLog').innerHTML = '';
  }
  function logLine(cls, text) {
    var logFull = document.getElementById('logFull');
    var full = document.createElement('div');
    full.className = cls;
    full.textContent = text;
    logFull.appendChild(full);
    logFull.scrollTop = logFull.scrollHeight;

    var miniLog = document.getElementById('miniLog');
    var mini = document.createElement('div');
    mini.className = cls;
    mini.textContent = text;
    miniLog.appendChild(mini);
    while (miniLog.children.length > 40) miniLog.removeChild(miniLog.firstChild);
    miniLog.scrollTop = miniLog.scrollHeight;
  }

  // ---------------------------------------------------------------
  // RENDERING
  // ---------------------------------------------------------------
  function effectTags(unit) {
    var html = '<div class="effects">';
    unit.buffs.forEach(function (b) {
      var label = b.type === 'Shield' ? b.type + ' ' + b.pool + 'hp (' + b.duration + ')' : b.type + ' (' + b.duration + ')';
      html += '<span class="effTag buff">' + label + '</span>';
    });
    var grouped = {};
    unit.debuffs.forEach(function (d) {
      if (!grouped[d.type]) grouped[d.type] = { count: 0, maxDuration: 0 };
      grouped[d.type].count += 1;
      grouped[d.type].maxDuration = Math.max(grouped[d.type].maxDuration, d.duration);
    });
    Object.keys(grouped).forEach(function (type) {
      var g = grouped[type];
      var label = type + (g.count > 1 ? ' x' + g.count : '') + ' (' + g.maxDuration + ')';
      html += '<span class="effTag debuff">' + label + '</span>';
    });
    html += '</div>';
    return html;
  }

  function unitCardHtml(unit, isActingActor, targetable) {
    var hpPct = Math.max(0, Math.round((unit.hp / unit.maxHp) * 100));
    var tmPct = Math.min(100, Math.round(unit.tm));
    var cls = 'unitCard' + (!unit.alive ? ' dead' : '') + (isActingActor ? ' acting' : '') + (targetable ? ' targetable' : '');
    return '' +
      '<div class="' + cls + '" data-uid="' + unit.uid + '">' +
        '<div class="unitTop"><span class="unitName">' + unit.name + '</span></div>' +
        '<div class="bar hpFillWrap"><div class="hpFill" style="width:' + hpPct + '%"></div></div>' +
        '<div class="barLabel"><span>' + unit.hp + '/' + unit.maxHp + '</span><span>' + hpPct + '%</span></div>' +
        '<div class="bar"><div class="tmFill" style="width:' + tmPct + '%"></div></div>' +
        effectTags(unit) +
      '</div>';
  }

  function assignUidOnce() {
    allUnits().forEach(function (u, i) { if (!u.uid) u.uid = (u.isEnemy ? 'e' : 'p') + i; });
  }

  function currentTargetType() {
    if (!pendingAction || !pendingAction.chosen) return null;
    var ability = pendingAction.actor[pendingAction.chosen];
    return ability.targetType || 'enemy';
  }

  function render() {
    assignUidOnce();
    var actor = pendingAction ? pendingAction.actor : null;
    var targetType = currentTargetType();

    document.getElementById('enemyList').innerHTML = enemies.map(function (u) {
      var targetable = !!(targetType === 'enemy' && u.alive);
      return unitCardHtml(u, actor === u, targetable);
    }).join('');

    document.getElementById('teamList').innerHTML = team.map(function (u) {
      var targetableAlly = !!(targetType === 'ally' && u.alive);
      return unitCardHtml(u, actor === u, targetableAlly);
    }).join('');

    renderActions();
    saveBattle();
  }

  function parsePassive(actor) {
    var text = actor.passive || '';
    var dashIdx = text.indexOf(' — ');
    return dashIdx === -1
      ? { name: 'Passive', text: text }
      : { name: text.slice(0, dashIdx), text: text.slice(dashIdx + 3) };
  }

  // Slot -> { name, text } for whichever ability the detail panel should describe.
  function slotInfo(actor, slot) {
    if (slot === 'basic') return { name: actor.basic.name, text: actor.basic.desc || '' };
    if (slot === 'active1') return { name: actor.active1.name, text: actor.active1.desc || '' };
    if (slot === 'active2') return { name: actor.active2.name, text: actor.active2.desc || '' };
    if (slot === 'passive') return parsePassive(actor);
    return { name: 'Signature', text: actor.signature || '' };
  }

  function skillButtonHtml(kind, ability, actor) {
    var onCooldown = kind !== 'basic' && actor.cooldowns[kind] > 0;
    var label = ability.name + (kind === 'basic' ? '' : onCooldown ? ' (' + actor.cooldowns[kind] + ')' : '');
    var selected = pendingAction.chosen === kind;
    var cls = 'skillBtn' + (selected ? ' selected' : '') + (highlightedSlot === kind ? ' highlighted' : '');
    return '<button class="' + cls + '" data-slot="' + kind + '"' + (onCooldown ? ' disabled' : '') + '>' + label + '</button>';
  }

  function infoButtonHtml(slot, name) {
    var cls = 'skillBtn infoOnly' + (highlightedSlot === slot ? ' highlighted' : '');
    return '<button class="' + cls + '" data-slot="' + slot + '">' + name + '</button>';
  }

  function renderActions() {
    var wrap = document.getElementById('actionsWrap');
    if (!pendingAction) {
      wrap.className = 'waiting';
      document.getElementById('skillRow').innerHTML = '<div style="color:#666;">Waiting for turn order...</div>';
      document.getElementById('skillDetail').innerHTML = '';
      document.getElementById('miniLog').style.display = 'none';
      return;
    }
    wrap.className = '';
    document.getElementById('miniLog').style.display = '';
    var actor = pendingAction.actor;
    var passiveInfo = parsePassive(actor);

    document.getElementById('skillRow').innerHTML =
      skillButtonHtml('basic', actor.basic, actor) +
      skillButtonHtml('active1', actor.active1, actor) +
      skillButtonHtml('active2', actor.active2, actor) +
      infoButtonHtml('passive', passiveInfo.name) +
      infoButtonHtml('signature', 'Signature');

    var info = slotInfo(actor, highlightedSlot);
    var detailHtml = '<span class="detailName">' + info.name + '</span>' + info.text;
    if (pendingAction.chosen && pendingAction.chosen === highlightedSlot) {
      detailHtml += '<span class="detailHint">Tap a target above.</span>';
    }
    document.getElementById('skillDetail').innerHTML = detailHtml;
  }

  // ---------------------------------------------------------------
  // EVENT WIRING (UI)
  // ---------------------------------------------------------------
  document.getElementById('skillRow').addEventListener('click', function (e) {
    var btn = e.target.closest('.skillBtn');
    if (!btn) return;
    var slot = btn.getAttribute('data-slot');
    if (slot === 'passive' || slot === 'signature') highlightInfoSlot(slot);
    else playerChooseAbility(slot);
  });

  document.getElementById('enemyList').addEventListener('click', function (e) {
    var card = e.target.closest('.unitCard.targetable');
    if (!card) return;
    var uid = card.getAttribute('data-uid');
    var target = enemies.find(function (u) { return u.uid === uid; });
    if (target) playerChooseTarget(target);
  });

  document.getElementById('teamList').addEventListener('click', function (e) {
    var card = e.target.closest('.unitCard.targetable');
    if (!card) return;
    var uid = card.getAttribute('data-uid');
    var target = team.find(function (u) { return u.uid === uid; });
    if (target) playerChooseTarget(target);
  });

  document.getElementById('miniLog').addEventListener('click', function () {
    document.getElementById('logOverlay').classList.add('show');
  });

  document.querySelectorAll('[data-close]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.getElementById(btn.getAttribute('data-close')).classList.remove('show');
    });
  });

  function beginEncounter(encounterId, teamIds) {
    clearSave();
    document.getElementById('teamSelectScreen').style.display = 'none';
    document.getElementById('startScreen').style.display = 'none';
    document.body.classList.add('battleActive');
    document.getElementById('battle').classList.add('active');
    newBattle(encounterId, teamIds);
    runUntilPlayerInput();
  }

  // ---------------------------------------------------------------
  // TEAM SELECT
  // ---------------------------------------------------------------
  var pendingEncounterId, selectedTeamIds;

  function squadSizeFor(encounterId) { return ENCOUNTERS[encounterId].teamIds.length; }

  function openTeamSelect(encounterId) {
    pendingEncounterId = encounterId;
    selectedTeamIds = ENCOUNTERS[encounterId].teamIds.slice();
    document.getElementById('startScreen').style.display = 'none';
    document.getElementById('teamSelectScreen').style.display = 'block';
    renderTeamSelect();
  }

  function toggleTeamMember(id) {
    var idx = selectedTeamIds.indexOf(id);
    if (idx !== -1) {
      selectedTeamIds.splice(idx, 1);
    } else if (selectedTeamIds.length < squadSizeFor(pendingEncounterId)) {
      selectedTeamIds.push(id);
    }
    renderTeamSelect();
  }

  function teamSelectCardHtml(champ) {
    var selected = selectedTeamIds.indexOf(champ.id) !== -1;
    var full = selectedTeamIds.length >= squadSizeFor(pendingEncounterId);
    var disabled = !selected && full;
    return '' +
      '<button class="selectCard' + (selected ? ' selected' : '') + '" data-id="' + champ.id + '"' + (disabled ? ' disabled' : '') + '>' +
        '<div class="selectName">' + champ.name + '</div>' +
        '<div class="selectRole">' + champ.role + '</div>' +
        '<div class="selectStats">HP ' + champ.hp + ' / ATK ' + champ.atk + ' / SPD ' + champ.spd + '</div>' +
      '</button>';
  }

  function renderTeamSelect() {
    var config = ENCOUNTERS[pendingEncounterId];
    var squadSize = squadSizeFor(pendingEncounterId);
    document.getElementById('teamSelectTitle').textContent = config.label.toUpperCase();
    document.getElementById('teamSelectCounter').textContent = 'Selected ' + selectedTeamIds.length + ' / ' + squadSize;
    document.getElementById('teamSelectGrid').innerHTML = CHAMPIONS.map(teamSelectCardHtml).join('');
    document.getElementById('teamSelectBeginBtn').disabled = selectedTeamIds.length !== squadSize;
  }

  document.getElementById('teamSelectGrid').addEventListener('click', function (e) {
    var btn = e.target.closest('.selectCard');
    if (!btn || btn.disabled) return;
    toggleTeamMember(btn.getAttribute('data-id'));
  });

  document.getElementById('teamSelectBackBtn').addEventListener('click', function () {
    document.getElementById('teamSelectScreen').style.display = 'none';
    document.getElementById('startScreen').style.display = '';
  });

  document.getElementById('teamSelectBeginBtn').addEventListener('click', function () {
    if (selectedTeamIds.length !== squadSizeFor(pendingEncounterId)) return;
    beginEncounter(pendingEncounterId, selectedTeamIds.slice());
  });

  document.getElementById('startBossBtn').addEventListener('click', function () { openTeamSelect('boss'); });
  document.getElementById('startWaveBtn').addEventListener('click', function () { openTeamSelect('wave'); });

  document.getElementById('resumeBtn').addEventListener('click', function () {
    var saved = loadSavedBattle();
    if (!saved) return;
    resumeBattle(saved);
  });

  document.getElementById('restartBtn').addEventListener('click', function () {
    document.getElementById('resultOverlay').classList.remove('show');
    newBattle(currentEncounterId, currentTeamIds);
    runUntilPlayerInput();
  });

  // On load, offer to resume a battle left in progress (backgrounded tab, reload, closed browser).
  (function checkForSavedBattle() {
    var saved = loadSavedBattle();
    if (!saved || !ENCOUNTERS[saved.encounterId]) return;
    document.getElementById('resumeBtn').style.display = '';
    document.getElementById('resumeBtn').textContent = 'RESUME ' + ENCOUNTERS[saved.encounterId].label.toUpperCase();
  })();

})();
</script>
</body>
</html>
